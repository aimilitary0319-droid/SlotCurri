experiment_group: slotcurri
experiment_name: ytvis_attnmass_v27

globals:
  NUM_SLOTS: 7
  SLOT_DIM: 64
  DINO_MODEL: vit_base_patch14_dinov2
  FEAT_DIM: 768
  NUM_PATCHES: 1369
  NUM_GPUS: 2
  BATCH_SIZE_PER_GPU: 32
  TOTAL_BATCH_SIZE: "${mul: ${.NUM_GPUS}, ${.BATCH_SIZE_PER_GPU}}"
  BASE_LR: 0.0001

trainer:
  max_steps: 100000
  log_every_n_steps: 2500
  val_check_interval: 2500
  gradient_clip_val: 0.05

optimizer:
  name: Adam
  lr: 0.0008
  lr_scheduler:
    name: exp_decay_with_warmup
    warmup_steps: 2500
    decay_steps: ${trainer.max_steps}

model:
  experiment_name: ${experiment_name}
  experiment_group: ${experiment_group}
  input_type: video
  max_steps: ${trainer.max_steps}
  visualize: false
  visualize_every_n_steps: 10000

  # Single-pass inference (same rationale as v20+): training was always single-pass, so no
  # extra backward sweep at eval.
  cyclic_inference: false

  # --- v27 = v26 + two auxiliary losses targeting v26's two residual failure modes ---
  #
  # Diagnosis (event_analysis/check_v25_on_losers.py, split_score_probe.py):
  #   (1) same-appearance adjacent instances collapse into ONE slot (e.g. the two skaters
  #       of rank00_sample100: both objects >= 97% owned by slot 2, ARI ~= 0 vs baseline
  #       0.83). Static featrec has ~zero gradient against this: DINO features of the two
  #       instances are near-identical, so one slot reconstructs both almost perfectly.
  #       Their positions/motions are what distinguishes them.
  #   (2) redundant/duplicate slots splitting one surface. gate_l1 (v2) was the intended
  #       fix but taxed every slot equally, evicting small-object slots first (active
  #       count fell to ~1.7); it has been off since.
  #
  # Fix (1) -- predictive feature reconstruction (pred_recon):
  #   L_pred = MSE(Dec(Pred(x_t)), F_{t+1})
  #   The slots at frame t, pushed through the (existing, otherwise-unsupervised-in-v26)
  #   transformer predictor, must reconstruct the NEXT frame's frozen features through
  #   the SAME decoder. One latent cannot carry two independent motions, so a merged
  #   slot leaves irreducible next-frame error; splitting becomes profitable. Supervises
  #   state_predicted_pregate (the predictor's own output, same reasoning as v23's
  #   loss_dyn) with the decoder gate detached: the term trains predictor/decoder/slots,
  #   never the gate. Unlike v23 (cosine on slot latents, failed) the target lives in
  #   feature space -- it prescribes WHAT the prediction must explain, not how latents
  #   should move. Only n_transitions random (t -> t+1) pairs are decoded per step to
  #   bound the extra decoder memory (~ +1/T instead of x2).
  #
  # Fix (2) -- counterfactual slot-utility rent (slot_utility):
  #   Per sample, drop one random gated slot, re-decode under no_grad, and measure the
  #   error increase on that slot's own (decoder-mask-weighted) territory relative to the
  #   sample's mean per-patch error. Rent relu(1 - rel_delta/margin) is charged on the
  #   slot's live gate: a duplicate slot's territory is covered by its twin after the
  #   decoder renorm (rel_delta ~ 0, full rent), while a small-object slot is
  #   irreplaceable on its own patches (rel_delta >> margin, exempt). Marginal-utility
  #   pricing removes exactly the size bias that killed gate_l1. Delta is detached; the
  #   gradient reaches only the gate's mass branch.
  #
  # Both weights ride the existing coupled-curriculum coefficient lambda_t (ramp: lambda),
  # so no new schedule: silent during the coarse phase (untrained predictor, intentional
  # merging), full strength over the consolidation stretch (lambda > 0.9 from ~60k).
  #
  # Weights: loss_pred is the same MSE/units as loss_featrec but with an irreducible
  # one-step-ahead floor, so 0.2 keeps featrec dominant. loss_util <= gate * 1 per
  # sample; 0.05 matches the rent scale v2 used, but here only redundant slots pay it.
  pred_recon:
    weight: 0.2
    n_transitions: 1        # random (t -> t+1) pairs decoded per step (memory bound)
    ramp: lambda            # effective weight = weight * lambda_t
    start_step: 0
  slot_utility:
    weight: 0.05
    margin: 1.0             # rent-free once dropping the slot costs >= 1x mean patch error
    gate_min: 0.5           # only gated-on slots are sampled
    min_mask: 0.01          # ... with enough territory for delta to be measurable
    ramp: lambda
    start_step: 0

  # --- v26 base: Evidence-Aware Slot Gating with Coupled Activity Curriculum ---
  # (unchanged; see ytvis2021_attnmass_v26.yaml for the full derivation and the
  # hard-won p_start/tau_g settings)
  attn_mass_curriculum:
    enabled: true
    n_default: 0
    p_start_mult: 1.5       # above the mass distribution: throttles the early winner too
    p_end_mult: 0.1         # p_end   = 0.1/7 ~= 0.0143
    p_anneal: cosine        # coupled curriculum: p driven by lambda_t
    anneal_steps: 75000     # curriculum over 3/4 of the run, last 25k = consolidation
    gate_mode: soft
    gate_form: logratio     # evidence-ratio gate (replaces linear (m - p)/tau)
    gate_tau_log: 0.5       # calibrated fallback: early-phase stability over max late sharpness
    beta_final: 0.7         # confidence contribution ramps 0 -> 0.3 with lambda_t
    mass_gamma: 2.0         # sharpening, used for activity estimation only
    gate_l1: 0.0
    gate_div: 0.0
    state_max_norm: true    # temporal gate alpha = g / max_j(g)
    contrastive_gate: false # loss_ss ignores the gate

  losses:
    loss_featrec:
      name: MSELoss
      pred_dims:
        - 0
        - ${globals.FEAT_DIM}
    loss_ss:
      name: Slot_Slot_Contrastive_Loss
      pred_key: processor.state
      temperature: 0.1
      batch_contrast: true
      patch_inputs: false
      keep_input_dim: true
      gate_negatives: false

  loss_weights:
    loss_featrec: 1.0
    loss_ss: 0.5

  initializer:
    name: FixedLearnedInit
    n_slots: ${globals.NUM_SLOTS}
    dim: ${globals.SLOT_DIM}

  encoder:
    backbone:
      name: TimmExtractor
      model: ${globals.DINO_MODEL}
      features: vit_block12
      frozen: true
      pretrained: true
    output_transform:
      name: networks.two_layer_mlp
      inp_dim: ${globals.FEAT_DIM}
      outp_dim: ${globals.SLOT_DIM}
      hidden_dim: "${mul: ${globals.FEAT_DIM}, 2}"
      layer_norm: true

  grouper:
    name: SlotAttention
    inp_dim: ${globals.SLOT_DIM}
    slot_dim: ${globals.SLOT_DIM}
    n_iters: 2
    use_mlp: true

  latent_processor:
    first_step_corrector_args:
      n_iters: 3

  decoder:
    name: MLPDecoder
    inp_dim: ${globals.SLOT_DIM}
    outp_dim: ${globals.FEAT_DIM}
    hidden_dims: [1024, 1024, 1024]
    n_patches: ${globals.NUM_PATCHES}

  predictor:
    name: networks.TransformerEncoder
    dim: ${globals.SLOT_DIM}
    n_blocks: 1
    n_heads: 4

val_metrics:
  ari:
    name: VideoARI
    ignore_background: false
    pred_key: decoder_masks_hard
    true_key: segmentations
  image_ari:
    name: ImageARI
    video_input: true
    ignore_background: false
    pred_key: decoder_masks_hard
    true_key: segmentations
  mbo:
    name: VideoIoU
    matching: overlap
    ignore_background: false
    pred_key: decoder_masks_hard
    true_key: segmentations
  image_mbo:
    name: ImageIoU
    matching: overlap
    video_input: true
    ignore_background: false
    pred_key: decoder_masks_hard
    true_key: segmentations

dataset:
  train_shards: "ytvis2021_resized/ytvis-train-{000000..000083}.tar"
  val_shards: "ytvis2021_resized/ytvis-validation-{000000..000029}.tar"
  batch_size: ${globals.BATCH_SIZE_PER_GPU}
  val_batch_size: 1
  val_size: 200
  num_workers: 4
  num_val_workers: 1
  train_pipeline:
    chunk_size: 4
    keys: [video]
    sample_one_chunk_per_video: true
    transforms:
      name: ytvis_train
      type: video
      crop_type: short_side_resize_random
      input_size: 518
      num_classes: 10
  val_pipeline:
    use_chunks: false
    keys: [video, segmentations]
    transforms:
      name: ytvis_val
      type: video
      crop_type: central
      input_size: 518
      num_classes: 25
