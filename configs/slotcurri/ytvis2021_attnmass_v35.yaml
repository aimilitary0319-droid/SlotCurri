experiment_group: slotcurri
experiment_name: ytvis_attnmass_v35

globals:
  NUM_SLOTS: 7
  SLOT_DIM: 64
  DINO_MODEL: vit_base_patch14_dinov2
  FEAT_DIM: 768
  NUM_PATCHES: 1369
  NUM_GPUS: 2
  BATCH_SIZE_PER_GPU: 32
  TOTAL_BATCH_SIZE: "${mul: ${.NUM_GPUS}, ${.BATCH_SIZE_PER_GPU}}"
  BASE_LR: 0.0001

trainer:
  max_steps: 100000
  log_every_n_steps: 2500
  val_check_interval: 2500
  gradient_clip_val: 0.05

optimizer:
  name: Adam
  lr: 0.0008
  lr_scheduler:
    name: exp_decay_with_warmup
    warmup_steps: 2500
    decay_steps: ${trainer.max_steps}

model:
  experiment_name: ${experiment_name}
  experiment_group: ${experiment_group}
  input_type: video
  max_steps: ${trainer.max_steps}
  visualize: false
  visualize_every_n_steps: 10000

  # Single-pass inference (same rationale as v20+): training was always single-pass, so no
  # extra backward sweep at eval.
  cyclic_inference: false

  # --- v35 = v32 (purity gating) + MODE-COVER feature curriculum ---
  #
  # Everything except the feature_curriculum block is byte-identical to
  # ytvis2021_attnmass_v34.yaml / v32. v33/v34 affinity-smooth tokens but keep F
  # distinct keys, so leftover slots still carve exclusive seats (Sigma c fills
  # by ~2.5k). v35 covers each token by the mean of its mean-shift attractor:
  #
  #   s(t) = (1 - cos(pi t / T)) / 2,   T = anneal_steps
  #   h(t) = h0 * (1 - s(t))            (0 when s=1 or h<=h_min)
  #   x_used = mode_cover(x, h)         if h > h_min
  #   x_used = x                        if h = 0   (cover OFF / raw)
  #
  # C = #{modes} is scene-dependent, not a scheduled K. Same k => slot attention
  # cannot split those seats. Shrinking h raises the number of modes so occupancy
  # can follow C. No mix-blend at intermediate h. No top-k, no token pyramid.
  # The v32 gate is unchanged: c = sg(purity), decoder softmax(alpha + log c).
  #
  # Success: 2.5k Sigma c tracks train/featcur_C (and C varies across clips).
  # All clips C ~= n_objects -> h0 too small. All clips C=1 -> h0 too large.
  # Stuck Sigma c after h drops -> hysteresis. Eval is still raw (train()-only).
  feature_curriculum:
    enabled: true
    anneal: modes     # clock is h(t); mix/window are v33/v34
    h_start: 0.5      # early kernel width on (cos-1); larger => fewer modes
    h_min: 0.02       # h<=h_min is raw (same role as w=0)
    n_iter: 8         # blurring mean-shift steps
    delta: 0.02       # clump attractors if cos > 1-delta
    probe: 128        # find modes on a 128-token stride; assign all F
    anneal_steps: 30000
    schedule: cosine
    chunk_size: 16

  # --- v32 purity gating, unchanged (see ytvis2021_attnmass_v32.yaml for the full
  # rationale): c = sg(sum A~^2 / sum A~) is the gate; decoder masks become
  # softmax(alpha + log c), temporal mix uses c / max(c). No thresholds, no gate
  # schedule, c detached. ---
  attn_mass_curriculum:
    enabled: true
    n_default: 0
    gate_mode: soft         # inert for purity_weight (kept for the gate stats logging)
    gate_form: purity_weight
    conf_kind: purity_sharp # ownership purity on the gamma-sharpened attention
    mass_gamma: 2.0         # sharpening for the purity statistic
    gate_l1: 0.0
    gate_div: 0.0
    state_max_norm: true    # temporal gate alpha = c / max_j(c)
    contrastive_gate: false # loss_ss ignores the gate (baseline-style)

  losses:
    loss_featrec:
      name: MSELoss
      pred_dims:
        - 0
        - ${globals.FEAT_DIM}
    loss_ss:
      name: Slot_Slot_Contrastive_Loss
      pred_key: processor.state
      temperature: 0.1
      batch_contrast: true
      patch_inputs: false
      keep_input_dim: true
      gate_negatives: false

  loss_weights:
    loss_featrec: 1.0
    loss_ss: 0.5

  initializer:
    name: FixedLearnedInit
    n_slots: ${globals.NUM_SLOTS}
    dim: ${globals.SLOT_DIM}

  encoder:
    backbone:
      name: TimmExtractor
      model: ${globals.DINO_MODEL}
      features: vit_block12
      frozen: true
      pretrained: true
    output_transform:
      name: networks.two_layer_mlp
      inp_dim: ${globals.FEAT_DIM}
      outp_dim: ${globals.SLOT_DIM}
      hidden_dim: "${mul: ${globals.FEAT_DIM}, 2}"
      layer_norm: true

  grouper:
    name: SlotAttention
    inp_dim: ${globals.SLOT_DIM}
    slot_dim: ${globals.SLOT_DIM}
    n_iters: 2
    use_mlp: true

  latent_processor:
    first_step_corrector_args:
      n_iters: 3

  decoder:
    name: MLPDecoder
    inp_dim: ${globals.SLOT_DIM}
    outp_dim: ${globals.FEAT_DIM}
    hidden_dims: [1024, 1024, 1024]
    n_patches: ${globals.NUM_PATCHES}

  predictor:
    name: networks.TransformerEncoder
    dim: ${globals.SLOT_DIM}
    n_blocks: 1
    n_heads: 4

val_metrics:
  ari:
    name: VideoARI
    ignore_background: false
    pred_key: decoder_masks_hard
    true_key: segmentations
  image_ari:
    name: ImageARI
    video_input: true
    ignore_background: false
    pred_key: decoder_masks_hard
    true_key: segmentations
  mbo:
    name: VideoIoU
    matching: overlap
    ignore_background: false
    pred_key: decoder_masks_hard
    true_key: segmentations
  image_mbo:
    name: ImageIoU
    matching: overlap
    video_input: true
    ignore_background: false
    pred_key: decoder_masks_hard
    true_key: segmentations

dataset:
  train_shards: "ytvis2021_resized/ytvis-train-{000000..000083}.tar"
  val_shards: "ytvis2021_resized/ytvis-validation-{000000..000029}.tar"
  batch_size: ${globals.BATCH_SIZE_PER_GPU}
  val_batch_size: 1
  val_size: 200
  num_workers: 4
  num_val_workers: 1
  train_pipeline:
    chunk_size: 4
    keys: [video]
    sample_one_chunk_per_video: true
    transforms:
      name: ytvis_train
      type: video
      crop_type: short_side_resize_random
      input_size: 518
      num_classes: 10
  val_pipeline:
    use_chunks: false
    keys: [video, segmentations]
    transforms:
      name: ytvis_val
      type: video
      crop_type: central
      input_size: 518
      num_classes: 25
