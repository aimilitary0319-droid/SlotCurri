experiment_group: slotcurri
experiment_name: coco_attnmass_v39lam1gu

globals:
  # v39lam1gu spatial path on COCO stills. Each image is a length-1 video
  # (dataset.*.as_single_frame_video), because the model forward is (B, T, N, D).
  # T=1 has no next frame: loss_ss and the predictor are omitted. What trains is
  # the Key ncut curriculum, the 8-neighbor λ1 gate, and gated + ungated featrec.
  # 224 = 16 * 14 patches. Shards are 256px, then cropped.
  NUM_SLOTS: 7
  SLOT_DIM: 64
  DINO_MODEL: vit_small_patch14_dinov2
  FEAT_DIM: 384
  NUM_PATCHES: 256
  NUM_GPUS: 2
  BATCH_SIZE_PER_GPU: 64
  TOTAL_BATCH_SIZE: "${mul: ${.NUM_GPUS}, ${.BATCH_SIZE_PER_GPU}}"
  BASE_LR: 0.0001

trainer:
  max_steps: 100000
  log_every_n_steps: 2500
  val_check_interval: 2500
  gradient_clip_val: 0.05

optimizer:
  name: Adam
  lr: 0.0008
  lr_scheduler:
    name: exp_decay_with_warmup
    warmup_steps: 2500
    decay_steps: ${trainer.max_steps}

model:
  experiment_name: ${experiment_name}
  experiment_group: ${experiment_group}
  input_type: video
  max_steps: ${trainer.max_steps}
  visualize: false
  visualize_every_n_steps: 10000
  cyclic_inference: false

  feature_curriculum:
    enabled: true
    anneal: ncut
    apply: key
    barrier: false
    anneal_steps: 50000
    schedule: cosine
    chunk_size: 8
    eps: 1.0e-6

  attn_mass_curriculum:
    enabled: true
    n_default: 0
    gate_mode: soft
    gate_form: purity_weight
    conf_kind: spectral_graph_n8_lam1
    mass_gamma: 1.0
    purity_normalize: false
    gate_l1: 0.0
    gate_div: 0.0
    state_max_norm: true
    predictor_src_gate: false
    contrastive_gate: false

  losses:
    loss_featrec:
      name: MSELoss
      pred_dims:
        - 0
        - ${globals.FEAT_DIM}
    loss_featrec_ungated:
      name: MSELoss
      pred_key: decoder.reconstruction_ungated
      pred_dims:
        - 0
        - ${globals.FEAT_DIM}

  loss_weights:
    loss_featrec: 1.0
    loss_featrec_ungated: 0.5

  initializer:
    name: FixedLearnedInit
    n_slots: ${globals.NUM_SLOTS}
    dim: ${globals.SLOT_DIM}

  encoder:
    backbone:
      name: TimmExtractor
      model: ${globals.DINO_MODEL}
      features: vit_block12
      frozen: true
      pretrained: true
      model_kwargs:
        dynamic_img_size: True
    output_transform:
      name: networks.two_layer_mlp
      inp_dim: ${globals.FEAT_DIM}
      outp_dim: ${globals.SLOT_DIM}
      hidden_dim: "${mul: ${globals.FEAT_DIM}, 2}"
      layer_norm: true

  grouper:
    name: SlotAttention
    inp_dim: ${globals.SLOT_DIM}
    slot_dim: ${globals.SLOT_DIM}
    n_iters: 2
    use_mlp: true

  latent_processor:
    first_step_corrector_args:
      n_iters: 3

  decoder:
    name: MLPDecoder
    inp_dim: ${globals.SLOT_DIM}
    outp_dim: ${globals.FEAT_DIM}
    hidden_dims: [1024, 1024, 1024]
    n_patches: ${globals.NUM_PATCHES}

  predictor: null

val_metrics:
  image_ari:
    name: ImageARI
    video_input: true
    ignore_overlaps: true
    pred_key: decoder_masks_hard
    true_key: segmentations
  image_mbo:
    name: ImageIoU
    matching: overlap
    video_input: true
    ignore_overlaps: true
    pred_key: decoder_masks_hard
    true_key: segmentations
  image_j_and_f:
    name: ImageJandF
    video_input: true
    ignore_overlaps: true
    pred_key: decoder_masks_hard
    true_key: segmentations

dataset:
  # scripts/prepare_coco_shards.sh with maxcount 128:
  # 118287 train images -> 925 shards, 5000 val images -> 40 shards.
  # Keys stay `image` so the shard filter keeps them. The pipeline then
  # renames image -> video and adds a length-1 time axis.
  train_shards: "coco/coco-train-{000000..000924}.tar"
  val_shards: "coco/coco-validation-{000000..000039}.tar"
  batch_size: ${globals.BATCH_SIZE_PER_GPU}
  val_batch_size: 16
  val_size: 5000
  num_workers: 4
  num_val_workers: 4
  train_pipeline:
    name: image
    keys: [image]
    is_video_dataset: false
    as_single_frame_video: true
    shuffle_size: 512
    transforms:
      name: coco_train
      type: image
      crop_type: random
      input_size: 224
      h_flip_prob: 0.5
  val_pipeline:
    name: image
    keys: [image, segmentations]
    is_video_dataset: false
    as_single_frame_video: true
    transforms:
      name: coco_val
      type: image
      crop_type: central
      input_size: 224
      # Max instances per image. Empty padded channels are ignored by IoU / J&F.
      # save_coco.py prints the real maximum; raise this if indexing fails.
      num_classes: 128
