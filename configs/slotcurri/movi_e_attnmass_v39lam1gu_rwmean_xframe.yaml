experiment_group: slotcurri
experiment_name: movi_e_attnmass_v39lam1gu_rwmean_xframe

globals:
  # SlotCurri MOVi-E backbone / pool (same as movi_e.yaml).
  NUM_SLOTS: 15
  SLOT_DIM: 128
  DINO_MODEL: vit_base_patch14_dinov2
  FEAT_DIM: 768
  NUM_PATCHES: 576
  NUM_GPUS: 2
  BATCH_SIZE_PER_GPU: 64
  TOTAL_BATCH_SIZE: "${mul: ${.NUM_GPUS}, ${.BATCH_SIZE_PER_GPU}}"
  BASE_LR: 0.0001

trainer:
  max_steps: 300000
  log_every_n_steps: 2500
  val_check_interval: 2500
  gradient_clip_val: 0.05

optimizer:
  name: Adam
  lr: 0.0008
  lr_scheduler:
    name: exp_decay_with_warmup
    warmup_steps: 2500
    decay_steps: ${trainer.max_steps}

model:
  experiment_name: ${experiment_name}
  experiment_group: ${experiment_group}
  input_type: video
  max_steps: ${trainer.max_steps}
  visualize: false
  visualize_every_n_steps: 10000
  cyclic_inference: false

  # --- MOVi-E v39lam1gu_rwmean_xframe = rwmean plus the frame-mean rescale ---
  #
  # Same as movi_e_attnmass_v39lam1gu.yaml except the Key mix is blocked
  # across a 2-way cut. Dense ReLU-cosine W is unchanged. v is the Fiedler of
  # L_sym = I - D^{-1/2} W D^{-1/2}. The cut uses y = D^{-1/2} v at its mean,
  # not the median of v (that is movi_e_attnmass_v39lam1gu_2cut.yaml).
  #      Z = X/||X||,  W = ReLU(Z Z^T),  W_ii = 0
  #      W_ij = 0 if c_i != c_j,   c = 1[y >= mean(y)],  y = D^{-1/2} v
  #      X^rel = P X,  P = row-normalize(W)
  #      X^rel <- mu + g (m_f - mu) + (X^rel - m_f)   # xframe
  #      X^bind = (1-s) X^rel + s X,   s: 0 -> 1 cosine over 150k
  # Keys only. Value, recon target, Pred source-gate, split L_featrec
  # (1.0 + 0.5), 15 slots, and the 300k schedule stay on v39lam1gu.
  # The λ1 gate is 8-neighbor. Similarities are squared and then
  # normalized the same way as v39:
  #      R_ij = ReLU(z_i^T z_j) if j in N_8(i), else 0
  #      (R ⊙ R)_ij = R_ij^2,  D̃_ii = sum_j R_ij^2
  #      S = D̃^{-1/2} (R ⊙ R) D̃^{-1/2}
  feature_curriculum:
    enabled: true
    anneal: ncut       # dense ReLU-cosine W, same graph as v39lam1gu
    apply: key         # Keys only; Value and recon target stay on original X
    barrier: true      # zero W across the cut; v39lam1gu leaves this false
    fiedler_cut: rw_mean  # y = D^{-1/2} v, threshold mean(y)
    ncut_iters: 6      # deflated power steps for the Fiedler; top vector is D^{1/2} 1
    anneal_steps: 150000  # 50% of 300k; s: 0 -> 1 (cosine); remaining 150k is raw Keys
    schedule: cosine
    chunk_size: 32     # MOVi-E is 24x24; larger chunks cut Fiedler launches
    eps: 1.0e-6
    xvid_energy: frame # X^rel <- mu + g (m_f - mu) + (P X - m_f); m_f = frame mean of P X

  attn_mass_curriculum:
    enabled: true
    n_default: 0
    gate_mode: soft         # inert for purity_weight (kept for the gate stats logging)
    gate_form: purity_weight
    conf_kind: spectral_graph_n8_lam1  # 8-nbr G_s; π = max(λ1, 0)
    s_form: dinv_rr  # S = D̃^{-1/2} (R ⊙ R) D̃^{-1/2}; D̃_ii = sum_j R_ij^2
    gate_graph: n8  # 8 neighbors; v39lam1gu is this support without the square
    mass_gamma: 1.0         # unused
    purity_normalize: false # no 1/K map; G_s scale already kills uniform ghosts
    gate_l1: 0.0
    gate_div: 0.0
    state_max_norm: true    # temporal gate alpha = π / max_j(π)
    predictor_src_gate: true  # Pred SA: B_ij = g_j exp(b_ij) / sum_k g_k exp(b_ik)
    contrastive_gate: false # loss_ss ignores the gate (baseline-style)

  losses:
    loss_featrec:
      name: MSELoss
      pred_dims:
        - 0
        - ${globals.FEAT_DIM}
    loss_featrec_ungated:
      name: MSELoss
      pred_key: decoder.reconstruction_ungated
      pred_dims:
        - 0
        - ${globals.FEAT_DIM}
    loss_ss:
      name: Slot_Slot_Contrastive_Loss
      pred_key: processor.state
      temperature: 0.1
      batch_contrast: true
      patch_inputs: false
      keep_input_dim: true
      gate_negatives: false

  loss_weights:
    loss_featrec: 1.0
    loss_featrec_ungated: 0.5
    loss_ss: 0.5

  initializer:
    name: FixedLearnedInit
    n_slots: ${globals.NUM_SLOTS}
    dim: ${globals.SLOT_DIM}
    shared_init: true  # once: shared N(0,1) + per-slot N(0,1); then learned

  encoder:
    backbone:
      name: TimmExtractor
      model: ${globals.DINO_MODEL}
      features: vit_block12
      frozen: true
      pretrained: true
      model_kwargs:
        dynamic_img_size: True
    output_transform:
      name: networks.two_layer_mlp
      inp_dim: ${globals.FEAT_DIM}
      outp_dim: ${globals.SLOT_DIM}
      hidden_dim: "${mul: ${globals.FEAT_DIM}, 2}"
      layer_norm: true

  grouper:
    name: SlotAttention
    inp_dim: ${globals.SLOT_DIM}
    slot_dim: ${globals.SLOT_DIM}
    n_iters: 2
    use_mlp: true

  latent_processor:
    first_step_corrector_args:
      n_iters: 3

  decoder:
    name: MLPDecoder
    inp_dim: ${globals.SLOT_DIM}
    outp_dim: ${globals.FEAT_DIM}
    hidden_dims: [1024, 1024, 1024]
    n_patches: ${globals.NUM_PATCHES}

  predictor:
    name: networks.TransformerEncoder
    dim: ${globals.SLOT_DIM}
    n_blocks: 1
    n_heads: 4

val_metrics:
  ari:
    name: VideoARI
    ignore_background: true
    pred_key: decoder_masks_hard
    true_key: segmentations
  image_ari:
    name: ImageARI
    ignore_background: true
    video_input: true
    pred_key: decoder_masks_hard
    true_key: segmentations
  mbo:
    name: VideoIoU
    matching: overlap
    ignore_background: true
    pred_key: decoder_masks_hard
    true_key: segmentations
  image_mbo:
    name: ImageIoU
    matching: overlap
    ignore_background: true
    video_input: true
    pred_key: decoder_masks_hard
    true_key: segmentations

dataset:
  train_shards: "movi_e/movi_e-train-{000000..000304}.tar"
  val_shards: "movi_e/movi_e-validation-{000000..000007}.tar"
  batch_size: ${globals.BATCH_SIZE_PER_GPU}
  val_batch_size: 4
  val_size: 250
  num_workers: 4
  num_val_workers: 1
  train_pipeline:
    video_size: 24
    chunk_size: 4
    sample_one_chunk_per_video: true
    keys: [video]
    shuffle_size: 512
    transforms:
      name: movi_train
      type: video
      input_size: 336
      h_flip_prob: 0.5
  val_pipeline:
    use_chunks: false
    keys: [video, segmentations]
    transforms:
      name: movi_val
      type: video
      input_size: 336
      num_classes: 24
