experiment_group: slotcurri
experiment_name: ytvis_attnmass_v21

globals:
  NUM_SLOTS: 7
  SLOT_DIM: 64
  DINO_MODEL: vit_base_patch14_dinov2
  FEAT_DIM: 768
  NUM_PATCHES: 1369
  NUM_GPUS: 2
  BATCH_SIZE_PER_GPU: 32
  TOTAL_BATCH_SIZE: "${mul: ${.NUM_GPUS}, ${.BATCH_SIZE_PER_GPU}}"
  BASE_LR: 0.0001

trainer:
  max_steps: 100000
  log_every_n_steps: 2500
  val_check_interval: 2500
  gradient_clip_val: 0.05

optimizer:
  name: Adam
  lr: 0.0008
  lr_scheduler:
    name: exp_decay_with_warmup
    warmup_steps: 2500
    decay_steps: ${trainer.max_steps}

model:
  experiment_name: ${experiment_name}
  experiment_group: ${experiment_group}
  input_type: video
  max_steps: 100000
  visualize: false
  visualize_every_n_steps: 10000

  # Single-pass inference: no extra backward sweep over the clip at validation/eval.
  # Training was always single-pass, so this removes the train/eval mismatch where the
  # gate saw every frame twice (once with a future-informed prior) only at eval.
  cyclic_inference: false

  # --- attention-mass curriculum: identical to v11 ---
  # v21 = v11 minus loss_ssim minus cyclic inference; v21 vs v20 is then the same
  # p-schedule comparison as v11 vs v10.
  #   p:   1.5 -> 0.1   linear  (v20: 1.5 -> 0.3 log)
  #   tau: 0.3          fixed
  # linear is paired with the lower p_end deliberately. Geometric annealing down to 0.1/7
  # would push p BELOW v10's early values (0.142 vs v10's 0.168 at 10k) and cut the coarse
  # phase short; linear instead holds p above v10 through the first half (0.184 at 10k)
  # and defers the drop, so the coarse->fine traverse gets longer, not shorter.
  # tau is deliberately not annealed to 0.1: measured on v10's 100k checkpoint, at
  # p_end=0.1/7 the threshold sits below every slot's mass, so sharpening tau only
  # saturates all gates to 1 and cuts the gate's post-renorm influence (relative-weight
  # spread 0.34 -> 0.12) instead of consolidating anything.
  attn_mass_curriculum:
    enabled: true
    n_default: 0
    p_start_mult: 1.5   # p_start = 1.5/7 ~= 0.214 (same as v20)
    p_end_mult: 0.1     # p_end   = 0.1/7 ~= 0.0143
    p_anneal: linear    # holds the coarse phase longer than log at this low p_end
    anneal_steps: 66000
    gate_mode: soft
    gate_tau_start_mult: 0.3   # tau = 0.3/7 ~= 0.0429, fixed (no anneal)
    gate_tau_end_mult: 0.3
    gate_l1: 0.0
    mass_gamma: 2.0
    gate_div: 0.0
    state_max_norm: true
    contrastive_gate: false

  losses:
    loss_featrec:
      name: MSELoss
      pred_dims:
        - 0
        - ${globals.FEAT_DIM}
    loss_ss:
      name: Slot_Slot_Contrastive_Loss
      pred_key: processor.state
      temperature: 0.1
      batch_contrast: true
      patch_inputs: false
      keep_input_dim: true
      gate_negatives: false

  loss_weights:
    loss_featrec: 1.0
    loss_ss: 0.5

  initializer:
    name: FixedLearnedInit
    n_slots: ${globals.NUM_SLOTS}
    dim: ${globals.SLOT_DIM}

  encoder:
    backbone:
      name: TimmExtractor
      model: ${globals.DINO_MODEL}
      features: vit_block12
      frozen: true
      pretrained: true
    output_transform:
      name: networks.two_layer_mlp
      inp_dim: ${globals.FEAT_DIM}
      outp_dim: ${globals.SLOT_DIM}
      hidden_dim: "${mul: ${globals.FEAT_DIM}, 2}"
      layer_norm: true

  grouper:
    name: SlotAttention
    inp_dim: ${globals.SLOT_DIM}
    slot_dim: ${globals.SLOT_DIM}
    n_iters: 2
    use_mlp: true

  latent_processor:
    first_step_corrector_args:
      n_iters: 3

  decoder:
    name: MLPDecoder
    inp_dim: ${globals.SLOT_DIM}
    outp_dim: ${globals.FEAT_DIM}
    hidden_dims: [1024, 1024, 1024]
    n_patches: ${globals.NUM_PATCHES}

  predictor:
    name: networks.TransformerEncoder
    dim: ${globals.SLOT_DIM}
    n_blocks: 1
    n_heads: 4

val_metrics:
  ari:
    name: VideoARI
    ignore_background: false
    pred_key: decoder_masks_hard
    true_key: segmentations
  image_ari:
    name: ImageARI
    video_input: true
    ignore_background: false
    pred_key: decoder_masks_hard
    true_key: segmentations
  mbo:
    name: VideoIoU
    matching: overlap
    ignore_background: false
    pred_key: decoder_masks_hard
    true_key: segmentations
  image_mbo:
    name: ImageIoU
    matching: overlap
    video_input: true
    ignore_background: false
    pred_key: decoder_masks_hard
    true_key: segmentations

dataset:
  train_shards: "ytvis2021_resized/ytvis-train-{000000..000083}.tar"
  val_shards: "ytvis2021_resized/ytvis-validation-{000000..000029}.tar"
  batch_size: ${globals.BATCH_SIZE_PER_GPU}
  val_batch_size: 1
  val_size: 200
  num_workers: 4
  num_val_workers: 1
  train_pipeline:
    chunk_size: 4
    keys: [video]
    sample_one_chunk_per_video: true
    transforms:
      name: ytvis_train
      type: video
      crop_type: short_side_resize_random
      input_size: 518
      num_classes: 10
  val_pipeline:
    use_chunks: false
    keys: [video, segmentations]
    transforms:
      name: ytvis_val
      type: video
      crop_type: central
      input_size: 518
      num_classes: 25
