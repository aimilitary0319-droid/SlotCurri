experiment_group: slotcurri
experiment_name: ytvis_slotcontrast_xframe_lin40_perron

# Eval-only Perron of the finished YTVIS SlotContrast xframe_lin40 step-100000
# checkpoint (train val ARI 0.414).
#
# Weights:
#   logs/_ytvis_slotcontrast_xframe_lin40/checkpoints/slotcurri_step=step=100000-v1.ckpt
#
# Same architecture as ytvis2021_slotcontrast_xframe_lin40.yaml. That run had no
# attention-mass gate, so this eval config adds the v39lam1gu n8 λ1 gate only so
# π and q̃_1 exist. Eval flags match the other *_perron.yaml runs:
#   eval_predictor_src_gate: false     → vanilla Pred SA
#   eval_perron_readout: true          → decoder m = softmax(α) ⊙ π ⊙ q̃_1
#   eval_predictor_pair_isolate: true  → live-live / ghost-ghost Pred SA
# Feature curriculum stays training-only; eval sees raw Keys.
# Losses stay the SlotContrast pair (featrec 1.0 + contrastive 0.5), ungated.

globals:
  NUM_SLOTS: 7
  SLOT_DIM: 64
  DINO_MODEL: vit_base_patch14_dinov2
  FEAT_DIM: 768
  NUM_PATCHES: 1369
  NUM_GPUS: 2
  BATCH_SIZE_PER_GPU: 32
  TOTAL_BATCH_SIZE: "${mul: ${.NUM_GPUS}, ${.BATCH_SIZE_PER_GPU}}"
  BASE_LR: 0.0001

trainer:
  max_steps: 100000
  log_every_n_steps: 2500
  val_check_interval: 2500
  gradient_clip_val: 0.05

optimizer:
  name: Adam
  lr: 0.0008
  lr_scheduler:
    name: exp_decay_with_warmup
    warmup_steps: 2500
    decay_steps: ${trainer.max_steps}

model:
  experiment_name: ${experiment_name}
  experiment_group: ${experiment_group}
  load_weights: logs/_ytvis_slotcontrast_xframe_lin40/checkpoints/slotcurri_step=step=100000-v1.ckpt
  input_type: video
  max_steps: 100000
  visualize: false
  visualize_every_n_steps: 10000

  slot_expansion: false
  cyclic_inference: false

  feature_curriculum:
    enabled: true
    anneal: ncut       # ReLU-cosine P X
    apply: key         # Keys only; Value and recon target stay on original X
    barrier: false     # no 2-way Fiedler/median region
    anneal_steps: 40000  # s = t/40k (linear); remaining 60k is raw Keys
    schedule: linear
    chunk_size: 8
    eps: 1.0e-6
    xvid_energy: frame # X^rel <- mu + g (m_f - mu) + (P X - m_f); m_f = frame mean of P X

  attn_mass_curriculum:
    enabled: true
    n_default: 0
    gate_mode: soft         # inert for purity_weight (kept for the gate stats logging)
    gate_form: purity_weight
    conf_kind: spectral_graph_n8_lam1  # 8-nbr G_s; π = max(λ1, 0)
    mass_gamma: 1.0         # unused
    purity_normalize: false # no 1/K map; G_s scale already kills uniform ghosts
    gate_l1: 0.0
    gate_div: 0.0
    state_max_norm: true    # temporal gate alpha = π / max_j(π)
    predictor_src_gate: true  # train definition: Pred SA B_ij = g_j exp(b_ij) / sum_k g_k exp(b_ik)
    eval_predictor_src_gate: false  # eval only: vanilla Pred SA
    eval_perron_readout: true       # eval only: decoder m = softmax(α) ⊙ π ⊙ q̃_1
    eval_predictor_pair_isolate: true  # eval only: live-live and ghost-ghost Pred SA
    contrastive_gate: false # loss_ss ignores the gate (baseline-style)

  losses:
    loss_featrec:
      name: MSELoss
      pred_dims:
        - 0
        - ${globals.FEAT_DIM}
    loss_ss:
      name: Slot_Slot_Contrastive_Loss
      pred_key: processor.state
      temperature: 0.1
      batch_contrast: true
      patch_inputs: false
      keep_input_dim: true

  loss_weights:
    loss_featrec: 1.0
    loss_ss: 0.5

  initializer:
    name: FixedLearnedInit
    n_slots: ${globals.NUM_SLOTS}
    dim: ${globals.SLOT_DIM}

  encoder:
    backbone:
      name: TimmExtractor
      model: ${globals.DINO_MODEL}
      features: vit_block12
      frozen: true
      pretrained: true
    output_transform:
      name: networks.two_layer_mlp
      inp_dim: ${globals.FEAT_DIM}
      outp_dim: ${globals.SLOT_DIM}
      hidden_dim: "${mul: ${globals.FEAT_DIM}, 2}"
      layer_norm: true

  grouper:
    name: SlotAttention
    inp_dim: ${globals.SLOT_DIM}
    slot_dim: ${globals.SLOT_DIM}
    n_iters: 2
    use_mlp: true

  latent_processor:
    first_step_corrector_args:
      n_iters: 3

  decoder:
    name: MLPDecoder
    inp_dim: ${globals.SLOT_DIM}
    outp_dim: ${globals.FEAT_DIM}
    hidden_dims: [1024, 1024, 1024]
    n_patches: ${globals.NUM_PATCHES}

  predictor:
    name: networks.TransformerEncoder
    dim: ${globals.SLOT_DIM}
    n_blocks: 1
    n_heads: 4

val_metrics:
  ari:
    name: VideoARI
    ignore_background: false
    pred_key: decoder_masks_hard
    true_key: segmentations
  image_ari:
    name: ImageARI
    video_input: true
    ignore_background: false
    pred_key: decoder_masks_hard
    true_key: segmentations
  mbo:
    name: VideoIoU
    matching: overlap
    ignore_background: false
    pred_key: decoder_masks_hard
    true_key: segmentations
  image_mbo:
    name: ImageIoU
    matching: overlap
    video_input: true
    ignore_background: false
    pred_key: decoder_masks_hard
    true_key: segmentations

dataset:
  train_shards: "ytvis2021_resized/ytvis-train-{000000..000083}.tar"
  val_shards: "ytvis2021_resized/ytvis-validation-{000000..000029}.tar"
  batch_size: ${globals.BATCH_SIZE_PER_GPU}
  val_batch_size: 1
  val_size: 200
  num_workers: 4
  num_val_workers: 1
  train_pipeline:
    chunk_size: 4
    keys: [video]
    sample_one_chunk_per_video: true
    transforms:
      name: ytvis_train
      type: video
      crop_type: short_side_resize_random
      input_size: 518
      num_classes: 10
  val_pipeline:
    use_chunks: false
    keys: [video, segmentations]
    transforms:
      name: ytvis_val
      type: video
      crop_type: central
      input_size: 518
      num_classes: 25
