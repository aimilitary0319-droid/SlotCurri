experiment_group: slotcurri
experiment_name: ytvis_attnmass_v26fmax

globals:
  NUM_SLOTS: 7
  SLOT_DIM: 64
  DINO_MODEL: vit_base_patch14_dinov2
  FEAT_DIM: 768
  NUM_PATCHES: 1369
  NUM_GPUS: 2
  BATCH_SIZE_PER_GPU: 32
  TOTAL_BATCH_SIZE: "${mul: ${.NUM_GPUS}, ${.BATCH_SIZE_PER_GPU}}"
  BASE_LR: 0.0001

trainer:
  max_steps: 100000
  log_every_n_steps: 2500
  val_check_interval: 2500
  gradient_clip_val: 0.05

optimizer:
  name: Adam
  lr: 0.0008
  lr_scheduler:
    name: exp_decay_with_warmup
    warmup_steps: 2500
    decay_steps: ${trainer.max_steps}

model:
  experiment_name: ${experiment_name}
  experiment_group: ${experiment_group}
  input_type: video
  max_steps: ${trainer.max_steps}
  visualize: false
  visualize_every_n_steps: 10000

  cyclic_inference: false

  # --- v26fmax: entropy x max(A) confidence, coupled curriculum, leftover p=0 ---
  #
  # v26 log-ratio gate with conf_kind entropy_max:
  #   c_s = sg( c_ent(A~_s) * max_f A_{s,f} )
  # c_ent is 1-H/log F on gamma-sharpened attention (v26). max_f A is peak
  # ownership on RAW softmax-over-slots attention (winner ~1, never-argmax < 0.5).
  # Large exclusive objects still pay the entropy size penalty (c_ent ~ 0.1).
  # This is NOT purity (E[A]); a single high-A speckle can inflate the peak.
  #
  # Schedule (MOVi-C small-object calibration, YTVIS uses the same):
  #   p:     cosine 1.5/S -> 0 over 75k, then 25k consolidation at identity
  #   beta:  1.0 -> 0.7 coupled to the same lambda (NOT v26f's 0.7-from-step-0)
  #   tau_g: 0.5
  # Early beta=1 is mass-only: entropy_max makes untrained c even smaller than
  # v26f (c_ent * 1/S), so engaging 1-beta from step 0 shuts every gate
  # (g~0.03). p_start 1.5 keeps the winner throttled. p_end=0 so leftover
  # 0.1/S cannot floor small objects; after 75k the shared gate is identity
  # (no separate temporal purity -- unlike v26p). Small objects start passing
  # around 60k on MOVi (S=11 cosine).
  attn_mass_curriculum:
    enabled: true
    n_default: 0
    p_start_mult: 1.5
    p_end_mult: 0.0
    p_anneal: cosine
    anneal_steps: 75000
    gate_mode: soft
    gate_form: logratio
    gate_tau_log: 0.5
    beta_start: 1.0         # coupled: mass-only until lambda rises
    beta_final: 0.7
    conf_kind: entropy_max  # c_ent(A~) * max_f A, detached
    mass_gamma: 2.0
    gate_l1: 0.0
    gate_div: 0.0
    state_max_norm: true
    contrastive_gate: false

  losses:
    loss_featrec:
      name: MSELoss
      pred_dims:
        - 0
        - ${globals.FEAT_DIM}
    loss_ss:
      name: Slot_Slot_Contrastive_Loss
      pred_key: processor.state
      temperature: 0.1
      batch_contrast: true
      patch_inputs: false
      keep_input_dim: true
      gate_negatives: false

  loss_weights:
    loss_featrec: 1.0
    loss_ss: 0.5

  initializer:
    name: FixedLearnedInit
    n_slots: ${globals.NUM_SLOTS}
    dim: ${globals.SLOT_DIM}

  encoder:
    backbone:
      name: TimmExtractor
      model: ${globals.DINO_MODEL}
      features: vit_block12
      frozen: true
      pretrained: true
    output_transform:
      name: networks.two_layer_mlp
      inp_dim: ${globals.FEAT_DIM}
      outp_dim: ${globals.SLOT_DIM}
      hidden_dim: "${mul: ${globals.FEAT_DIM}, 2}"
      layer_norm: true

  grouper:
    name: SlotAttention
    inp_dim: ${globals.SLOT_DIM}
    slot_dim: ${globals.SLOT_DIM}
    n_iters: 2
    use_mlp: true

  latent_processor:
    first_step_corrector_args:
      n_iters: 3

  decoder:
    name: MLPDecoder
    inp_dim: ${globals.SLOT_DIM}
    outp_dim: ${globals.FEAT_DIM}
    hidden_dims: [1024, 1024, 1024]
    n_patches: ${globals.NUM_PATCHES}

  predictor:
    name: networks.TransformerEncoder
    dim: ${globals.SLOT_DIM}
    n_blocks: 1
    n_heads: 4

val_metrics:
  ari:
    name: VideoARI
    ignore_background: false
    pred_key: decoder_masks_hard
    true_key: segmentations
  image_ari:
    name: ImageARI
    video_input: true
    ignore_background: false
    pred_key: decoder_masks_hard
    true_key: segmentations
  mbo:
    name: VideoIoU
    matching: overlap
    ignore_background: false
    pred_key: decoder_masks_hard
    true_key: segmentations
  image_mbo:
    name: ImageIoU
    matching: overlap
    video_input: true
    ignore_background: false
    pred_key: decoder_masks_hard
    true_key: segmentations

dataset:
  train_shards: "ytvis2021_resized/ytvis-train-{000000..000083}.tar"
  val_shards: "ytvis2021_resized/ytvis-validation-{000000..000029}.tar"
  batch_size: ${globals.BATCH_SIZE_PER_GPU}
  val_batch_size: 1
  val_size: 200
  num_workers: 4
  num_val_workers: 1
  train_pipeline:
    chunk_size: 4
    keys: [video]
    sample_one_chunk_per_video: true
    transforms:
      name: ytvis_train
      type: video
      crop_type: short_side_resize_random
      input_size: 518
      num_classes: 10
  val_pipeline:
    use_chunks: false
    keys: [video, segmentations]
    transforms:
      name: ytvis_val
      type: video
      crop_type: central
      input_size: 518
      num_classes: 25
