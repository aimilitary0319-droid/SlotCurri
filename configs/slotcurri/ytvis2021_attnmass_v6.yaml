experiment_group: slotcurri
experiment_name: ytvis_attnmass_v6

globals:
  NUM_SLOTS: 7
  SLOT_DIM: 64
  DINO_MODEL: vit_base_patch14_dinov2
  FEAT_DIM: 768
  NUM_PATCHES: 1369
  NUM_GPUS: 2
  BATCH_SIZE_PER_GPU: 32
  TOTAL_BATCH_SIZE: "${mul: ${.NUM_GPUS}, ${.BATCH_SIZE_PER_GPU}}"
  BASE_LR: 0.0001

trainer:
  max_steps: 100000
  log_every_n_steps: 2500
  val_check_interval: 2500
  gradient_clip_val: 0.05

optimizer:
  name: Adam
  lr: 0.0008
  lr_scheduler:
    name: exp_decay_with_warmup
    warmup_steps: 2500
    decay_steps: ${trainer.max_steps}

model:
  experiment_name: ${experiment_name}
  experiment_group: ${experiment_group}
  input_type: video
  max_steps: 100000
  visualize: false
  visualize_every_n_steps: 10000

  # --- attention-mass curriculum v6: FORWARD tau (WIDE early -> SHARP late) + mass_gamma=1.0 ---
  # Context: v4/v5 used a REVERSED tau (sharp early -> wide late) and collapsed FAST to ~1.0.
  # But v2 was ALREADY forward-tau and STILL collapsed (3.4 -> 1.18), so forward tau alone is
  # necessary-but-not-sufficient. v2's slow collapse traces to a mass-concentration feedback
  # loop: reconstruction concentrates mass on a dominant "blob" slot, mass_gamma=2 AMPLIFIES
  # that winner share, and the gate-freeze then locks losers out (low mass -> low gate ->
  # frozen -> can't learn -> mass stays low). v6 attacks that loop directly by setting
  # mass_gamma=1.0 (plain mass, no winner amplification) while keeping the safe forward-tau
  # schedule. (v7 = v6 + gate_div for a second anti-concentration lever.)
  #
  # Forward tau restores the STANDARD deterministic-annealing direction (soft->hard, high temp
  # -> low temp), matching soft->hard k-means, Gumbel-softmax annealing, etc.:
  #  * WIDE tau early: (mass - p)/tau ~= 0 for every slot -> g ~= 0.5 for ALL slots. Every
  #    slot is half-open, so it (a) is NOT frozen (gets a corrector/GRU update) and (b)
  #    contributes to reconstruction and thus receives gradient. This is the only window in
  #    which a currently-low-mass slot can learn content and grow its mass. active is floored
  #    at ~S/2 ~= 3.5, so early collapse is impossible.
  #  * SHARP tau late: once slots hold real object content, the mass ranking is meaningful, so
  #    the gate sharpens to a hard 0/1 around p and consolidates genuine redundancy (fewer
  #    slots per object) -> anti-fragmentation, WITHOUT the early irreversible death.
  #  * WIDE early also buffers the (moderately high) p_start: even where mass < p, the wide tau
  #    keeps g near 0.5 rather than 0, so no slot is prematurely killed.
  # Eval always uses tau_end (sharpest) + p_end, i.e. the consolidated hard gate.
  attn_mass_curriculum:
    enabled: true
    n_default: 0
    # p is only mildly annealed (coarse->fine); tau does the soft->hard work. The boundary is
    # placed below a real content slot's mass and above empty-slot mass so eval separates them.
    p_start_mult: 1     # p_start = 1/7 ~= 0.143 (uniform mass anchor)
    p_end_mult: 0.3     # p_end   = 0.3/7  ~= 0.043 (inference boundary content-vs-empty)
    anneal_steps: 66000
    gate_mode: soft
    # FORWARD tau: WIDE early -> SHARP late (this is the v6 fix).
    gate_tau_start_mult: 1.0   # tau_start = 1.0/7 ~= 0.143 (WIDE: all g~=0.5, all slots alive/explore)
    gate_tau_end_mult: 0.1     # tau_end   = 0.1/7 ~= 0.0143 (SHARP: hard consolidation at inference)
    gate_l1: 0.0
    # mass_gamma 1.0 (plain attention mass, NOT gamma-sharpened). v2/v4/v5 all used gamma=2,
    # which amplifies the winner's mass share and accelerates the mass-concentration /
    # rich-get-richer collapse (v2 fell 3.4 -> 1.18). Setting gamma=1 removes that amplifier
    # so we test whether plain mass + forward tau keeps more slots alive.
    mass_gamma: 1.0
    gate_div: 0.0
    # purity rescue disabled (ablation card)
    # purity_q_start: 1.5
    # purity_q_end: 0.5
    # purity_tau: 0.05

  losses:
    loss_featrec:
      name: MSELoss
      pred_dims:
        - 0
        - ${globals.FEAT_DIM}
    loss_ssim:
      name: SSIMLoss
      pred_key: encoder.SSIM_recon
      target_key: encoder.SSIM_orig
      pred_dims:
        - 0
        - ${globals.FEAT_DIM}
    loss_ss:
      name: Slot_Slot_Contrastive_Loss
      pred_key: processor.state
      temperature: 0.1
      batch_contrast: true
      patch_inputs: false
      keep_input_dim: true
      # gate_negatives OFF: it weights contrastive negatives by their gate (log_a1 added to
      # logits), which makes the task easier as other slots' gates shrink -> a second
      # concentration/collapse incentive. Disabled here; combined with the detached `pair`
      # weights in Slot_Slot_Contrastive_Loss, loss_ss no longer pushes the gates at all.
      gate_negatives: false

  loss_weights:
    loss_featrec: 1.0
    loss_ssim: 0.05
    loss_ss: 0.5

  initializer:
    name: FixedLearnedInit
    n_slots: ${globals.NUM_SLOTS}
    dim: ${globals.SLOT_DIM}

  encoder:
    backbone:
      name: TimmExtractor
      model: ${globals.DINO_MODEL}
      features: vit_block12
      frozen: true
      pretrained: true
    output_transform:
      name: networks.two_layer_mlp
      inp_dim: ${globals.FEAT_DIM}
      outp_dim: ${globals.SLOT_DIM}
      hidden_dim: "${mul: ${globals.FEAT_DIM}, 2}"
      layer_norm: true

  grouper:
    name: SlotAttention
    inp_dim: ${globals.SLOT_DIM}
    slot_dim: ${globals.SLOT_DIM}
    n_iters: 2
    use_mlp: true

  latent_processor:
    first_step_corrector_args:
      n_iters: 3

  decoder:
    name: MLPDecoder
    inp_dim: ${globals.SLOT_DIM}
    outp_dim: ${globals.FEAT_DIM}
    hidden_dims: [1024, 1024, 1024]
    n_patches: ${globals.NUM_PATCHES}

  predictor:
    name: networks.TransformerEncoder
    dim: ${globals.SLOT_DIM}
    n_blocks: 1
    n_heads: 4

val_metrics:
  ari:
    name: VideoARI
    ignore_background: false
    pred_key: decoder_masks_hard
    true_key: segmentations
  image_ari:
    name: ImageARI
    video_input: true
    ignore_background: false
    pred_key: decoder_masks_hard
    true_key: segmentations
  mbo:
    name: VideoIoU
    matching: overlap
    ignore_background: false
    pred_key: decoder_masks_hard
    true_key: segmentations
  image_mbo:
    name: ImageIoU
    matching: overlap
    video_input: true
    ignore_background: false
    pred_key: decoder_masks_hard
    true_key: segmentations

dataset:
  train_shards: "ytvis2021_resized/ytvis-train-{000000..000083}.tar"
  val_shards: "ytvis2021_resized/ytvis-validation-{000000..000029}.tar"
  batch_size: ${globals.BATCH_SIZE_PER_GPU}
  val_batch_size: 1
  val_size: 200
  num_workers: 4
  num_val_workers: 1
  train_pipeline:
    chunk_size: 4
    keys: [video]
    sample_one_chunk_per_video: true
    transforms:
      name: ytvis_train
      type: video
      crop_type: short_side_resize_random
      input_size: 518
      num_classes: 10
  val_pipeline:
    use_chunks: false
    keys: [video, segmentations]
    transforms:
      name: ytvis_val
      type: video
      crop_type: central
      input_size: 518
      num_classes: 25
