experiment_group: slotcurri
experiment_name: ytvis_attnmass_v2

globals:
  # attention-mass curriculum v2: no default slots, uniform-anchored thresholds,
  # gamma-sharpened mass, stronger L1. Slot pool matched to the SlotCurri ytvis
  # baseline (max 7 slots) for a fair comparison.
  NUM_SLOTS: 7
  SLOT_DIM: 64
  DINO_MODEL: vit_base_patch14_dinov2
  FEAT_DIM: 768
  NUM_PATCHES: 1369
  NUM_GPUS: 2
  BATCH_SIZE_PER_GPU: 32
  TOTAL_BATCH_SIZE: "${mul: ${.NUM_GPUS}, ${.BATCH_SIZE_PER_GPU}}"
  BASE_LR: 0.0001

trainer:
  max_steps: 100000
  log_every_n_steps: 2500
  val_check_interval: 2500
  gradient_clip_val: 0.05

optimizer:
  name: Adam
  lr: 0.0008
  lr_scheduler:
    name: exp_decay_with_warmup
    warmup_steps: 2500
    decay_steps: ${trainer.max_steps}

model:
  experiment_name: ${experiment_name}
  experiment_group: ${experiment_group}
  input_type: video
  max_steps: 100000
  visualize: false
  visualize_every_n_steps: 10000

  # --- attention-mass curriculum v2 (soft gating, no defaults) ---
  # v2 design rationale (from the v1 failure analysis + mass calibration on ytvis val):
  #  * v1 absolute p_start (0.35) was unreachable for single objects (median object =
  #    1.7% of frame) -> only the 2 default slots ever activated ("2-slot lock-in"),
  #    and frozen non-default slots were squeezed to mass ~0.006 by the trained
  #    defaults (rich-get-richer deadlock: frozen -> can't grow mass -> stays frozen).
  #  * v2 anchors p_start AT the uniform mass (1/n_slots): reachable by construction
  #    (at init attention is ~uniform, every gate starts at ~0.5, all slots keep
  #    updating at half rate -> no deadlock), and since masses sum to 1, at least one
  #    slot always has mass >= 1/n_slots -> the active set can never be empty ->
  #    default slots are unnecessary (n_default: 0).
  #  * mass_gamma 2 sharpens per-patch attention toward the argmax winner share:
  #    small-but-cleanly-owned object slots keep their mass while diffuse
  #    "always-second" ghost slots collapse -> separates real small objects (~0.03)
  #    from squeezed noise (~0.006) at the p_end boundary.
  #  * gate_l1 0.05 (was 0.02): with no exempt defaults the L1 "rent" is the main
  #    consolidation pressure; ~0.007 per extra slot vs featrec ~1.9.
  attn_mass_curriculum:
    enabled: true
    n_default: 0        # no always-active slots; pigeonhole (sum of masses = 1) keeps
                        # the active set non-empty for any p <= 1/n_slots
    p_start_mult: 1     # p_start = 1/7 ~= 0.143 (= uniform mass; every gate ~0.5 at init)
    p_end_mult: 0.2     # p_end   = 0.2/7 ~= 0.029; also used at eval
    anneal_steps: 66000 # linear anneal over ~2/3 of max_steps; final 1/3 trains at p_end
    gate_mode: soft
    gate_tau_start_mult: 0.5  # tau_start = 0.5/7 ~= 0.071 (wide band: nothing hard-frozen early)
    gate_tau_end_mult: 0.05   # tau_end   = 0.05/7 ~= 0.0071 (sharp, near-hard); also used at eval
    # L1 sparsity penalty DISABLED (0.0): with YTVIS's tiny objects (median 1.7%) even
    # marginal object slots have small reconstruction benefit, so the L1 "rent" was
    # suppressing their activation (active fell to ~1.7). Removed to test whether the
    # gating mechanism alone (uniform-anchored p, gamma-sharpened mass) lets more slots
    # activate. Anti-fragmentation is then left to the mass threshold + gate_negatives.
    gate_l1: 0.0
    # gamma-sharpened mass: per-patch attention raised to gamma and renormalized before
    # the mass average (2 -> toward per-patch argmax winner share; suppresses ghosts).
    mass_gamma: 2.0
    # purity rescue stays disabled (ablation card); revisit if small objects are
    # still absorbed at p_end.
    # purity_q_start: 1.5
    # purity_q_end: 0.5
    # purity_tau: 0.05

  losses:
    loss_featrec:
      name: MSELoss
      pred_dims:
        - 0
        - ${globals.FEAT_DIM}
    loss_ssim:
      name: SSIMLoss
      pred_key: encoder.SSIM_recon
      target_key: encoder.SSIM_orig
      pred_dims:
        - 0
        - ${globals.FEAT_DIM}
    loss_ss:
      name: Slot_Slot_Contrastive_Loss
      pred_key: processor.state
      temperature: 0.1
      batch_contrast: true
      patch_inputs: false
      keep_input_dim: true
      gate_negatives: true   # weight dormant/partially-gated slots as negatives by their gate

  loss_weights:
    loss_featrec: 1.0
    loss_ssim: 0.05
    loss_ss: 0.5

  initializer:
    # aligned with the SlotCurri/SlotContrast baseline (learnable prototypes)
    name: FixedLearnedInit
    n_slots: ${globals.NUM_SLOTS}
    dim: ${globals.SLOT_DIM}

  encoder:
    backbone:
      name: TimmExtractor
      model: ${globals.DINO_MODEL}
      features: vit_block12
      frozen: true
      pretrained: true
    output_transform:
      name: networks.two_layer_mlp
      inp_dim: ${globals.FEAT_DIM}
      outp_dim: ${globals.SLOT_DIM}
      hidden_dim: "${mul: ${globals.FEAT_DIM}, 2}"
      layer_norm: true

  grouper:
    name: SlotAttention
    inp_dim: ${globals.SLOT_DIM}
    slot_dim: ${globals.SLOT_DIM}
    n_iters: 2
    use_mlp: true

  latent_processor:
    first_step_corrector_args:
      n_iters: 3

  decoder:
    name: MLPDecoder
    inp_dim: ${globals.SLOT_DIM}
    outp_dim: ${globals.FEAT_DIM}
    hidden_dims: [1024, 1024, 1024]
    n_patches: ${globals.NUM_PATCHES}

  predictor:
    name: networks.TransformerEncoder
    dim: ${globals.SLOT_DIM}
    n_blocks: 1
    n_heads: 4

val_metrics:
  ari:
    name: VideoARI
    ignore_background: false
    pred_key: decoder_masks_hard
    true_key: segmentations
  image_ari:
    name: ImageARI
    video_input: true
    ignore_background: false
    pred_key: decoder_masks_hard
    true_key: segmentations
  mbo:
    name: VideoIoU
    matching: overlap
    ignore_background: false
    pred_key: decoder_masks_hard
    true_key: segmentations
  image_mbo:
    name: ImageIoU
    matching: overlap
    video_input: true
    ignore_background: false
    pred_key: decoder_masks_hard
    true_key: segmentations

dataset:
  train_shards: "ytvis2021_resized/ytvis-train-{000000..000083}.tar"
  val_shards: "ytvis2021_resized/ytvis-validation-{000000..000029}.tar"
  batch_size: ${globals.BATCH_SIZE_PER_GPU}
  val_batch_size: 1
  val_size: 200
  num_workers: 4
  num_val_workers: 1
  train_pipeline:
    chunk_size: 4
    keys: [video]
    sample_one_chunk_per_video: true
    transforms:
      name: ytvis_train
      type: video
      crop_type: short_side_resize_random
      input_size: 518
      num_classes: 10
  val_pipeline:
    use_chunks: false
    keys: [video, segmentations]
    transforms:
      name: ytvis_val
      type: video
      crop_type: central
      input_size: 518
      num_classes: 25
