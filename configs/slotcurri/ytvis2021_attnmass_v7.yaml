experiment_group: slotcurri
experiment_name: ytvis_attnmass_v7

globals:
  NUM_SLOTS: 7
  SLOT_DIM: 64
  DINO_MODEL: vit_base_patch14_dinov2
  FEAT_DIM: 768
  NUM_PATCHES: 1369
  NUM_GPUS: 2
  BATCH_SIZE_PER_GPU: 32
  TOTAL_BATCH_SIZE: "${mul: ${.NUM_GPUS}, ${.BATCH_SIZE_PER_GPU}}"
  BASE_LR: 0.0001

trainer:
  max_steps: 100000
  log_every_n_steps: 2500
  val_check_interval: 2500
  gradient_clip_val: 0.05

optimizer:
  name: Adam
  lr: 0.0008
  lr_scheduler:
    name: exp_decay_with_warmup
    warmup_steps: 2500
    decay_steps: ${trainer.max_steps}

model:
  experiment_name: ${experiment_name}
  experiment_group: ${experiment_group}
  input_type: video
  max_steps: 100000
  visualize: false
  visualize_every_n_steps: 10000

  # --- attention-mass curriculum v7 = v6 with mass_gamma=2.0 (gate_div off) ---
  # Same as v6 (forward tau, pair-detach, gate_negatives:false, gate_div=0) EXCEPT
  # mass_gamma=2.0. Isolates whether gamma-sharpened mass still collapses under the
  # pair-detach + forward-tau setup (v6 = gamma 1.0 baseline).
  #
  # Forward tau restores the STANDARD deterministic-annealing direction (soft->hard, high temp
  # -> low temp), matching soft->hard k-means, Gumbel-softmax annealing, etc.:
  #  * WIDE tau early: (mass - p)/tau ~= 0 for every slot -> g ~= 0.5 for ALL slots. Every
  #    slot is half-open, so it (a) is NOT frozen (gets a corrector/GRU update) and (b)
  #    contributes to reconstruction and thus receives gradient. active floored at ~S/2 ~= 3.5.
  #  * SHARP tau late: once slots hold real object content, the mass ranking is meaningful, so
  #    the gate sharpens to a hard 0/1 around p and consolidates genuine redundancy.
  # Eval always uses tau_end (sharpest) + p_end, i.e. the consolidated hard gate.
  attn_mass_curriculum:
    enabled: true
    n_default: 0
    p_start_mult: 1     # p_start = 1/7 ~= 0.143 (uniform mass anchor)
    p_end_mult: 0.3     # p_end   = 0.3/7  ~= 0.043 (inference boundary content-vs-empty)
    anneal_steps: 66000
    gate_mode: soft
    # FORWARD tau: WIDE early -> SHARP late.
    gate_tau_start_mult: 1.0   # tau_start = 1.0/7 ~= 0.143 (WIDE: all g~=0.5, all slots alive/explore)
    gate_tau_end_mult: 0.1     # tau_end   = 0.1/7 ~= 0.0143 (SHARP: hard consolidation at inference)
    gate_l1: 0.0
    mass_gamma: 2.0     # gamma-sharpened mass (winner amplification); contrast with v6 gamma=1.0
    # batch-entropy diversity loss: maximize entropy of batch-mean per-slot usage (MoE-style
    # load balancing) -> spreads usage across slots, directly counteracting the rich-get-richer
    # mass concentration that collapsed v2. Term = lambda*(log S - H(usage)); tune by watching
    # train/active_slots and val mbo (too large -> forced-uniform usage -> over-fragmentation).
    gate_div: 0.0
    # purity rescue disabled (ablation card)
    # purity_q_start: 1.5
    # purity_q_end: 0.5
    # purity_tau: 0.05

  losses:
    loss_featrec:
      name: MSELoss
      pred_dims:
        - 0
        - ${globals.FEAT_DIM}
    loss_ssim:
      name: SSIMLoss
      pred_key: encoder.SSIM_recon
      target_key: encoder.SSIM_orig
      pred_dims:
        - 0
        - ${globals.FEAT_DIM}
    loss_ss:
      name: Slot_Slot_Contrastive_Loss
      pred_key: processor.state
      temperature: 0.1
      batch_contrast: true
      patch_inputs: false
      keep_input_dim: true
      # gate_negatives OFF: it weights contrastive negatives by their gate (log_a1 added to
      # logits), which makes the task easier as other slots' gates shrink -> a second
      # concentration/collapse incentive. Disabled here; combined with the detached `pair`
      # weights in Slot_Slot_Contrastive_Loss, loss_ss no longer pushes the gates at all.
      gate_negatives: false

  loss_weights:
    loss_featrec: 1.0
    loss_ssim: 0.05
    loss_ss: 0.5

  initializer:
    name: FixedLearnedInit
    n_slots: ${globals.NUM_SLOTS}
    dim: ${globals.SLOT_DIM}

  encoder:
    backbone:
      name: TimmExtractor
      model: ${globals.DINO_MODEL}
      features: vit_block12
      frozen: true
      pretrained: true
    output_transform:
      name: networks.two_layer_mlp
      inp_dim: ${globals.FEAT_DIM}
      outp_dim: ${globals.SLOT_DIM}
      hidden_dim: "${mul: ${globals.FEAT_DIM}, 2}"
      layer_norm: true

  grouper:
    name: SlotAttention
    inp_dim: ${globals.SLOT_DIM}
    slot_dim: ${globals.SLOT_DIM}
    n_iters: 2
    use_mlp: true

  latent_processor:
    first_step_corrector_args:
      n_iters: 3

  decoder:
    name: MLPDecoder
    inp_dim: ${globals.SLOT_DIM}
    outp_dim: ${globals.FEAT_DIM}
    hidden_dims: [1024, 1024, 1024]
    n_patches: ${globals.NUM_PATCHES}

  predictor:
    name: networks.TransformerEncoder
    dim: ${globals.SLOT_DIM}
    n_blocks: 1
    n_heads: 4

val_metrics:
  ari:
    name: VideoARI
    ignore_background: false
    pred_key: decoder_masks_hard
    true_key: segmentations
  image_ari:
    name: ImageARI
    video_input: true
    ignore_background: false
    pred_key: decoder_masks_hard
    true_key: segmentations
  mbo:
    name: VideoIoU
    matching: overlap
    ignore_background: false
    pred_key: decoder_masks_hard
    true_key: segmentations
  image_mbo:
    name: ImageIoU
    matching: overlap
    video_input: true
    ignore_background: false
    pred_key: decoder_masks_hard
    true_key: segmentations

dataset:
  train_shards: "ytvis2021_resized/ytvis-train-{000000..000083}.tar"
  val_shards: "ytvis2021_resized/ytvis-validation-{000000..000029}.tar"
  batch_size: ${globals.BATCH_SIZE_PER_GPU}
  val_batch_size: 1
  val_size: 200
  num_workers: 4
  num_val_workers: 1
  train_pipeline:
    chunk_size: 4
    keys: [video]
    sample_one_chunk_per_video: true
    transforms:
      name: ytvis_train
      type: video
      crop_type: short_side_resize_random
      input_size: 518
      num_classes: 10
  val_pipeline:
    use_chunks: false
    keys: [video, segmentations]
    transforms:
      name: ytvis_val
      type: video
      crop_type: central
      input_size: 518
      num_classes: 25
