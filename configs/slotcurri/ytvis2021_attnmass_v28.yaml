experiment_group: slotcurri
experiment_name: ytvis_attnmass_v28

globals:
  NUM_SLOTS: 7
  SLOT_DIM: 64
  DINO_MODEL: vit_base_patch14_dinov2
  FEAT_DIM: 768
  NUM_PATCHES: 1369
  NUM_GPUS: 2
  BATCH_SIZE_PER_GPU: 32
  TOTAL_BATCH_SIZE: "${mul: ${.NUM_GPUS}, ${.BATCH_SIZE_PER_GPU}}"
  BASE_LR: 0.0001

trainer:
  max_steps: 100000
  log_every_n_steps: 2500
  val_check_interval: 2500
  gradient_clip_val: 0.05

optimizer:
  name: Adam
  lr: 0.0008
  lr_scheduler:
    name: exp_decay_with_warmup
    warmup_steps: 2500
    decay_steps: ${trainer.max_steps}

model:
  experiment_name: ${experiment_name}
  experiment_group: ${experiment_group}
  input_type: video
  max_steps: ${trainer.max_steps}
  visualize: false
  visualize_every_n_steps: 10000

  # Single-pass inference (same rationale as v20+): training was always single-pass, so no
  # extra backward sweep at eval.
  cyclic_inference: false

  # --- v28 = v26 + predictive feature reconstruction ONLY (L_pred ablation of v27) ---
  #
  # v27 adds two losses at once (pred_recon + slot_utility); v28 isolates pred_recon so
  # the v26 / v28 / v27 triplet attributes any gain to the right term:
  #   v26 -> v28 : effect of L_pred alone (the merged-instances fix)
  #   v28 -> v27 : marginal effect of the counterfactual slot-utility rent
  #
  # L_pred = MSE(Dec(Pred(x_t)), F_{t+1}): the slots at frame t, pushed through the
  # (existing, otherwise-unsupervised-in-v26) transformer predictor, must reconstruct the
  # NEXT frame's frozen features through the SAME decoder. Static featrec has ~zero
  # gradient against holding two same-appearance adjacent instances in one slot (their
  # DINO features are near-identical; see rank00_sample100: both skaters >= 97% owned by
  # one slot, ARI ~= 0 vs baseline 0.83) -- but one latent cannot carry two independent
  # motions, so a merged slot leaves irreducible next-frame error and splitting becomes
  # profitable. Supervises state_predicted_pregate (the predictor's own output, same
  # reasoning as v23's loss_dyn) with the decoder gate detached: the term trains
  # predictor/decoder/slots, never the gate. Unlike v23 (cosine on slot latents, failed)
  # the target lives in feature space -- it prescribes WHAT the prediction must explain,
  # not how latents should move.
  #
  # The weight rides the existing coupled-curriculum coefficient lambda_t (ramp: lambda),
  # so no new schedule: silent during the coarse phase (untrained predictor, intentional
  # merging), full strength over the consolidation stretch (lambda > 0.9 from ~60k).
  # loss_pred is the same MSE/units as loss_featrec but with an irreducible one-step-ahead
  # floor, so 0.2 keeps featrec dominant. Only n_transitions random (t -> t+1) pairs are
  # decoded per step to bound the extra decoder memory (~ +1/T instead of x2).
  pred_recon:
    weight: 0.2
    n_transitions: 1        # random (t -> t+1) pairs decoded per step (memory bound)
    ramp: lambda            # effective weight = weight * lambda_t
    start_step: 0

  # --- v26 base: Evidence-Aware Slot Gating with Coupled Activity Curriculum ---
  # (unchanged; see ytvis2021_attnmass_v26.yaml for the full derivation and the
  # hard-won p_start/tau_g settings)
  attn_mass_curriculum:
    enabled: true
    n_default: 0
    p_start_mult: 1.5       # above the mass distribution: throttles the early winner too
    p_end_mult: 0.1         # p_end   = 0.1/7 ~= 0.0143
    p_anneal: cosine        # coupled curriculum: p driven by lambda_t
    anneal_steps: 75000     # curriculum over 3/4 of the run, last 25k = consolidation
    gate_mode: soft
    gate_form: logratio     # evidence-ratio gate (replaces linear (m - p)/tau)
    gate_tau_log: 0.5       # calibrated fallback: early-phase stability over max late sharpness
    beta_final: 0.7         # confidence contribution ramps 0 -> 0.3 with lambda_t
    mass_gamma: 2.0         # sharpening, used for activity estimation only
    gate_l1: 0.0
    gate_div: 0.0
    state_max_norm: true    # temporal gate alpha = g / max_j(g)
    contrastive_gate: false # loss_ss ignores the gate

  losses:
    loss_featrec:
      name: MSELoss
      pred_dims:
        - 0
        - ${globals.FEAT_DIM}
    loss_ss:
      name: Slot_Slot_Contrastive_Loss
      pred_key: processor.state
      temperature: 0.1
      batch_contrast: true
      patch_inputs: false
      keep_input_dim: true
      gate_negatives: false

  loss_weights:
    loss_featrec: 1.0
    loss_ss: 0.5

  initializer:
    name: FixedLearnedInit
    n_slots: ${globals.NUM_SLOTS}
    dim: ${globals.SLOT_DIM}

  encoder:
    backbone:
      name: TimmExtractor
      model: ${globals.DINO_MODEL}
      features: vit_block12
      frozen: true
      pretrained: true
    output_transform:
      name: networks.two_layer_mlp
      inp_dim: ${globals.FEAT_DIM}
      outp_dim: ${globals.SLOT_DIM}
      hidden_dim: "${mul: ${globals.FEAT_DIM}, 2}"
      layer_norm: true

  grouper:
    name: SlotAttention
    inp_dim: ${globals.SLOT_DIM}
    slot_dim: ${globals.SLOT_DIM}
    n_iters: 2
    use_mlp: true

  latent_processor:
    first_step_corrector_args:
      n_iters: 3

  decoder:
    name: MLPDecoder
    inp_dim: ${globals.SLOT_DIM}
    outp_dim: ${globals.FEAT_DIM}
    hidden_dims: [1024, 1024, 1024]
    n_patches: ${globals.NUM_PATCHES}

  predictor:
    name: networks.TransformerEncoder
    dim: ${globals.SLOT_DIM}
    n_blocks: 1
    n_heads: 4

val_metrics:
  ari:
    name: VideoARI
    ignore_background: false
    pred_key: decoder_masks_hard
    true_key: segmentations
  image_ari:
    name: ImageARI
    video_input: true
    ignore_background: false
    pred_key: decoder_masks_hard
    true_key: segmentations
  mbo:
    name: VideoIoU
    matching: overlap
    ignore_background: false
    pred_key: decoder_masks_hard
    true_key: segmentations
  image_mbo:
    name: ImageIoU
    matching: overlap
    video_input: true
    ignore_background: false
    pred_key: decoder_masks_hard
    true_key: segmentations

dataset:
  train_shards: "ytvis2021_resized/ytvis-train-{000000..000083}.tar"
  val_shards: "ytvis2021_resized/ytvis-validation-{000000..000029}.tar"
  batch_size: ${globals.BATCH_SIZE_PER_GPU}
  val_batch_size: 1
  val_size: 200
  num_workers: 4
  num_val_workers: 1
  train_pipeline:
    chunk_size: 4
    keys: [video]
    sample_one_chunk_per_video: true
    transforms:
      name: ytvis_train
      type: video
      crop_type: short_side_resize_random
      input_size: 518
      num_classes: 10
  val_pipeline:
    use_chunks: false
    keys: [video, segmentations]
    transforms:
      name: ytvis_val
      type: video
      crop_type: central
      input_size: 518
      num_classes: 25
