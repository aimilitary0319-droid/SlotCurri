experiment_group: slotcurri
experiment_name: ytvis_attnmass_v30

globals:
  NUM_SLOTS: 7
  SLOT_DIM: 64
  DINO_MODEL: vit_base_patch14_dinov2
  FEAT_DIM: 768
  NUM_PATCHES: 1369
  NUM_GPUS: 2
  BATCH_SIZE_PER_GPU: 32
  TOTAL_BATCH_SIZE: "${mul: ${.NUM_GPUS}, ${.BATCH_SIZE_PER_GPU}}"
  BASE_LR: 0.0001

trainer:
  max_steps: 100000
  log_every_n_steps: 2500
  val_check_interval: 2500
  gradient_clip_val: 0.05

optimizer:
  name: Adam
  lr: 0.0008
  lr_scheduler:
    name: exp_decay_with_warmup
    warmup_steps: 2500
    decay_steps: ${trainer.max_steps}

model:
  experiment_name: ${experiment_name}
  experiment_group: ${experiment_group}
  input_type: video
  max_steps: ${trainer.max_steps}
  visualize: false
  visualize_every_n_steps: 10000

  # Single-pass inference (same rationale as v20+): training was always single-pass, so no
  # extra backward sweep at eval.
  cyclic_inference: false

  # --- v30 = v29 (purity gate) + L_pred (predictive feature reconstruction) ---
  #
  # Combines the two orthogonal single-variable improvements, completing the 2x2 grid
  # with v26 (base), v28 (base + L_pred) and v29 (base + purity gate):
  #   purity gate (v29): fixes GATE HYGIENE -- the entropy confidence was near chance at
  #     separating ghosts from small objects (AUC 0.647); ownership purity on the same
  #     sharpened attention is ~perfect (0.999) and halves ghost leakage at the unchanged
  #     working point (see ytvis2021_attnmass_v29.yaml and conf_vs_purity_probe.py).
  #   L_pred (v28): fixes MERGES -- Dec(Pred(x_t)) must reconstruct F_{t+1}, so holding
  #     two same-appearance, independently-moving instances in one slot leaves an
  #     irreducible next-frame error that static featrec never charges for (see
  #     ytvis2021_attnmass_v28.yaml; the rank00_sample100 failure).
  # The mechanisms do not share a lever: L_pred's gradient reaches predictor/decoder/
  # slots and never the gate (detached decoder gate, pregate states), while conf_kind
  # only changes the (detached) confidence statistic inside the gate. Interactions should
  # therefore be additive; v28/v29/v30 vs v26 attributes each term and their sum.
  pred_recon:
    weight: 0.2
    n_transitions: 1        # random (t -> t+1) pairs decoded per step (memory bound)
    ramp: lambda            # effective weight = weight * lambda_t
    start_step: 0

  # --- v29 gate: evidence-ratio with ownership-purity confidence (see v29 yaml) ---
  attn_mass_curriculum:
    enabled: true
    n_default: 0
    p_start_mult: 1.5       # above the mass distribution: throttles the early winner too
    p_end_mult: 0.1         # p_end   = 0.1/7 ~= 0.0143
    p_anneal: cosine        # coupled curriculum: p driven by lambda_t
    anneal_steps: 75000     # curriculum over 3/4 of the run, last 25k = consolidation
    gate_mode: soft
    gate_form: logratio     # evidence-ratio gate (unchanged)
    conf_kind: purity_sharp # v29: ownership (sum A~^2 / sum A~) replaces entropy confidence
    gate_tau_log: 0.5       # unchanged; probe: ghost gate 0.125 here (entropy gave 0.304)
    beta_final: 0.7         # unchanged; probe beta sweep confirms 0.7 as the balance point
    mass_gamma: 2.0         # sharpening, used for the mass branch only
    gate_l1: 0.0
    gate_div: 0.0
    state_max_norm: true    # temporal gate alpha = g / max_j(g)
    contrastive_gate: false # loss_ss ignores the gate

  losses:
    loss_featrec:
      name: MSELoss
      pred_dims:
        - 0
        - ${globals.FEAT_DIM}
    loss_ss:
      name: Slot_Slot_Contrastive_Loss
      pred_key: processor.state
      temperature: 0.1
      batch_contrast: true
      patch_inputs: false
      keep_input_dim: true
      gate_negatives: false

  loss_weights:
    loss_featrec: 1.0
    loss_ss: 0.5

  initializer:
    name: FixedLearnedInit
    n_slots: ${globals.NUM_SLOTS}
    dim: ${globals.SLOT_DIM}

  encoder:
    backbone:
      name: TimmExtractor
      model: ${globals.DINO_MODEL}
      features: vit_block12
      frozen: true
      pretrained: true
    output_transform:
      name: networks.two_layer_mlp
      inp_dim: ${globals.FEAT_DIM}
      outp_dim: ${globals.SLOT_DIM}
      hidden_dim: "${mul: ${globals.FEAT_DIM}, 2}"
      layer_norm: true

  grouper:
    name: SlotAttention
    inp_dim: ${globals.SLOT_DIM}
    slot_dim: ${globals.SLOT_DIM}
    n_iters: 2
    use_mlp: true

  latent_processor:
    first_step_corrector_args:
      n_iters: 3

  decoder:
    name: MLPDecoder
    inp_dim: ${globals.SLOT_DIM}
    outp_dim: ${globals.FEAT_DIM}
    hidden_dims: [1024, 1024, 1024]
    n_patches: ${globals.NUM_PATCHES}

  predictor:
    name: networks.TransformerEncoder
    dim: ${globals.SLOT_DIM}
    n_blocks: 1
    n_heads: 4

val_metrics:
  ari:
    name: VideoARI
    ignore_background: false
    pred_key: decoder_masks_hard
    true_key: segmentations
  image_ari:
    name: ImageARI
    video_input: true
    ignore_background: false
    pred_key: decoder_masks_hard
    true_key: segmentations
  mbo:
    name: VideoIoU
    matching: overlap
    ignore_background: false
    pred_key: decoder_masks_hard
    true_key: segmentations
  image_mbo:
    name: ImageIoU
    matching: overlap
    video_input: true
    ignore_background: false
    pred_key: decoder_masks_hard
    true_key: segmentations

dataset:
  train_shards: "ytvis2021_resized/ytvis-train-{000000..000083}.tar"
  val_shards: "ytvis2021_resized/ytvis-validation-{000000..000029}.tar"
  batch_size: ${globals.BATCH_SIZE_PER_GPU}
  val_batch_size: 1
  val_size: 200
  num_workers: 4
  num_val_workers: 1
  train_pipeline:
    chunk_size: 4
    keys: [video]
    sample_one_chunk_per_video: true
    transforms:
      name: ytvis_train
      type: video
      crop_type: short_side_resize_random
      input_size: 518
      num_classes: 10
  val_pipeline:
    use_chunks: false
    keys: [video, segmentations]
    transforms:
      name: ytvis_val
      type: video
      crop_type: central
      input_size: 518
      num_classes: 25
