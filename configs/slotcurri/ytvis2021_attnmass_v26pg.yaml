experiment_group: slotcurri
experiment_name: ytvis_attnmass_v26pg

globals:
  NUM_SLOTS: 7
  SLOT_DIM: 64
  DINO_MODEL: vit_base_patch14_dinov2
  FEAT_DIM: 768
  NUM_PATCHES: 1369
  NUM_GPUS: 2
  BATCH_SIZE_PER_GPU: 32
  TOTAL_BATCH_SIZE: "${mul: ${.NUM_GPUS}, ${.BATCH_SIZE_PER_GPU}}"
  BASE_LR: 0.0001

trainer:
  max_steps: 100000
  log_every_n_steps: 2500
  val_check_interval: 2500
  gradient_clip_val: 0.05

optimizer:
  name: Adam
  lr: 0.0008
  lr_scheduler:
    name: exp_decay_with_warmup
    warmup_steps: 2500
    decay_steps: ${trainer.max_steps}

model:
  experiment_name: ${experiment_name}
  experiment_group: ${experiment_group}
  input_type: video
  max_steps: ${trainer.max_steps}
  visualize: false
  visualize_every_n_steps: 10000

  cyclic_inference: false

  # --- v26pg: v26p + temporal mix is purity ⊙ decoder mass gate ---
  #
  # v26p left the temporal mix on purity alone, so ~6.3/7 slots advanced from
  # ~2k while the decoder was still 2-slot. On YTVIS that is the v26m gap:
  # the mass curriculum's actual capacity restriction acts on the temporal
  # mix. v26pg restores it without mixing purity into log r (the v29 failure):
  #      g_dec = sigmoid(log(m / p_t) / tau_g)    decoder, same as v26p
  #      pi    = clip((K c - 1)/(K - 1), 0, 1)    v36 purity_sharp
  #      alpha = (pi * g_dec) / max_j(pi * g_dec)
  # Early: unused slots stay at their prior. p=0 / eval: g_dec=1, same as v26p.
  attn_mass_curriculum:
    enabled: true
    n_default: 0
    p_start_mult: 1.5       # p_start = 1.5/7 ~= 0.214
    p_end_mult: 0.0         # fade decoder mass gate out; eval decoder is ungated
    p_anneal: cosine
    anneal_steps: 75000     # curriculum over 3/4, last 25k = open-decoder consolidation
    gate_mode: soft
    gate_form: logratio     # decoder: v26m mass-only log-ratio
    state_gate_form: purity_weight  # temporal statistic is v36 purity
    state_mul_decoder: true         # temporal = pi ⊙ g_dec, then max-norm
    gate_tau_log: 0.5
    beta_final: 1.0         # mass-only evidence on the decoder
    conf_kind: purity_sharp # ownership purity on gamma-sharpened attention (temporal)
    mass_gamma: 2.0
    purity_normalize: true  # p = clip((K c - 1)/(K - 1), 0, 1)
    gate_l1: 0.0
    gate_div: 0.0
    state_max_norm: true    # temporal alpha = (pi g) / max_j(pi g)
    contrastive_gate: false

  losses:
    loss_featrec:
      name: MSELoss
      pred_dims:
        - 0
        - ${globals.FEAT_DIM}
    loss_ss:
      name: Slot_Slot_Contrastive_Loss
      pred_key: processor.state
      temperature: 0.1
      batch_contrast: true
      patch_inputs: false
      keep_input_dim: true
      gate_negatives: false

  loss_weights:
    loss_featrec: 1.0
    loss_ss: 0.5

  initializer:
    name: FixedLearnedInit
    n_slots: ${globals.NUM_SLOTS}
    dim: ${globals.SLOT_DIM}

  encoder:
    backbone:
      name: TimmExtractor
      model: ${globals.DINO_MODEL}
      features: vit_block12
      frozen: true
      pretrained: true
    output_transform:
      name: networks.two_layer_mlp
      inp_dim: ${globals.FEAT_DIM}
      outp_dim: ${globals.SLOT_DIM}
      hidden_dim: "${mul: ${globals.FEAT_DIM}, 2}"
      layer_norm: true

  grouper:
    name: SlotAttention
    inp_dim: ${globals.SLOT_DIM}
    slot_dim: ${globals.SLOT_DIM}
    n_iters: 2
    use_mlp: true

  latent_processor:
    first_step_corrector_args:
      n_iters: 3

  decoder:
    name: MLPDecoder
    inp_dim: ${globals.SLOT_DIM}
    outp_dim: ${globals.FEAT_DIM}
    hidden_dims: [1024, 1024, 1024]
    n_patches: ${globals.NUM_PATCHES}

  predictor:
    name: networks.TransformerEncoder
    dim: ${globals.SLOT_DIM}
    n_blocks: 1
    n_heads: 4

val_metrics:
  ari:
    name: VideoARI
    ignore_background: false
    pred_key: decoder_masks_hard
    true_key: segmentations
  image_ari:
    name: ImageARI
    video_input: true
    ignore_background: false
    pred_key: decoder_masks_hard
    true_key: segmentations
  mbo:
    name: VideoIoU
    matching: overlap
    ignore_background: false
    pred_key: decoder_masks_hard
    true_key: segmentations
  image_mbo:
    name: ImageIoU
    matching: overlap
    video_input: true
    ignore_background: false
    pred_key: decoder_masks_hard
    true_key: segmentations

dataset:
  train_shards: "ytvis2021_resized/ytvis-train-{000000..000083}.tar"
  val_shards: "ytvis2021_resized/ytvis-validation-{000000..000029}.tar"
  batch_size: ${globals.BATCH_SIZE_PER_GPU}
  val_batch_size: 1
  val_size: 200
  num_workers: 4
  num_val_workers: 1
  train_pipeline:
    chunk_size: 4
    keys: [video]
    sample_one_chunk_per_video: true
    transforms:
      name: ytvis_train
      type: video
      crop_type: short_side_resize_random
      input_size: 518
      num_classes: 10
  val_pipeline:
    use_chunks: false
    keys: [video, segmentations]
    transforms:
      name: ytvis_val
      type: video
      crop_type: central
      input_size: 518
      num_classes: 25
