experiment_group: slotcurri
experiment_name: ytvis_attnmass_v40

globals:
  NUM_SLOTS: 7
  SLOT_DIM: 64
  DINO_MODEL: vit_base_patch14_dinov2
  FEAT_DIM: 768
  NUM_PATCHES: 1369
  NUM_GPUS: 2
  BATCH_SIZE_PER_GPU: 32
  TOTAL_BATCH_SIZE: "${mul: ${.NUM_GPUS}, ${.BATCH_SIZE_PER_GPU}}"
  BASE_LR: 0.0001

trainer:
  max_steps: 100000
  log_every_n_steps: 2500
  val_check_interval: 2500
  gradient_clip_val: 0.05

optimizer:
  name: Adam
  lr: 0.0008
  lr_scheduler:
    name: exp_decay_with_warmup
    warmup_steps: 2500
    decay_steps: ${trainer.max_steps}

model:
  experiment_name: ${experiment_name}
  experiment_group: ${experiment_group}
  input_type: video
  max_steps: ${trainer.max_steps}
  visualize: false
  visualize_every_n_steps: 10000

  # --- v40 = SlotContrast + K-normalized ownership gate + coupled ent/imp losses ---
  #
  # Base is ytvis2021_slotcontrast.yaml (no mass p-schedule, no log-ratio, no
  # feature curriculum, no slot expansion, single-pass eval).
  #
  # Confidence (the gate) is K-normalized v29 ownership on last-iter raw A:
  #      u_s = sum_f A_{s,f}^2 / sum_f A_{s,f}
  #      c_s = clip((K u_s - 1)/(K - 1), 0, 1)     # 1/K -> 0, exclusive -> 1
  #    Decoder: softmax(alpha + log(c+eps)); all-zero c recovers softmax(alpha).
  #    Temporal: alpha = c / max(c); all-zero is identity mix.
  #    Gate uses sg(c). No p, tau, beta, mass, or spectral-π gate.
  #
  # Aux losses share one cosine clock λ_t = (1-cos(π t/T))/2, T = 50k:
  #      L_ent = E[ H(q) / log K ],  q ∝ c+eps     # live A: concentrate c
  #      L_imp = E[ sum_s sg(c_s) ρ_s / (sum sg(c)+eps) ]
  #      ρ_s   = max(λ2, 0) / (max(λ1, 0) + eps) on v39 8-nbr G_s
  #    w_ent = w0 (1-λ), w_imp = w0 λ, w0 = 0.2.
  #    Early: few slots hold c (coarse). Late: impurity splits two-community
  #    slots, so c spreads and featrec can drop. L_imp uses live a, sg(Z).
  slot_expansion: false
  cyclic_inference: false

  attn_mass_curriculum:
    enabled: true
    n_default: 0
    gate_mode: soft
    gate_form: purity_weight
    conf_kind: purity           # raw A (γ=1); K-map is purity_normalize
    mass_gamma: 1.0
    purity_normalize: true      # c is the K-normalized ownership
    gate_l1: 0.0
    gate_div: 0.0
    state_max_norm: true
    contrastive_gate: false

  slot_ent_impurity:
    enabled: true
    weight: 0.2                 # w0; w_ent + w_imp = w0
    anneal_steps: 50000         # T; last 50k is impurity-only
    eps: 1.0e-6
    chunk_size: 8
    n_iter: 16

  losses:
    loss_featrec:
      name: MSELoss
      pred_dims:
        - 0
        - ${globals.FEAT_DIM}
    loss_ss:
      name: Slot_Slot_Contrastive_Loss
      pred_key: processor.state
      temperature: 0.1
      batch_contrast: true
      patch_inputs: false
      keep_input_dim: true
      gate_negatives: false

  loss_weights:
    loss_featrec: 1.0
    loss_ss: 0.5

  initializer:
    name: FixedLearnedInit
    n_slots: ${globals.NUM_SLOTS}
    dim: ${globals.SLOT_DIM}

  encoder:
    backbone:
      name: TimmExtractor
      model: ${globals.DINO_MODEL}
      features: vit_block12
      frozen: true
      pretrained: true
    output_transform:
      name: networks.two_layer_mlp
      inp_dim: ${globals.FEAT_DIM}
      outp_dim: ${globals.SLOT_DIM}
      hidden_dim: "${mul: ${globals.FEAT_DIM}, 2}"
      layer_norm: true

  grouper:
    name: SlotAttention
    inp_dim: ${globals.SLOT_DIM}
    slot_dim: ${globals.SLOT_DIM}
    n_iters: 2
    use_mlp: true

  latent_processor:
    first_step_corrector_args:
      n_iters: 3

  decoder:
    name: MLPDecoder
    inp_dim: ${globals.SLOT_DIM}
    outp_dim: ${globals.FEAT_DIM}
    hidden_dims: [1024, 1024, 1024]
    n_patches: ${globals.NUM_PATCHES}

  predictor:
    name: networks.TransformerEncoder
    dim: ${globals.SLOT_DIM}
    n_blocks: 1
    n_heads: 4

val_metrics:
  ari:
    name: VideoARI
    ignore_background: false
    pred_key: decoder_masks_hard
    true_key: segmentations
  image_ari:
    name: ImageARI
    video_input: true
    ignore_background: false
    pred_key: decoder_masks_hard
    true_key: segmentations
  mbo:
    name: VideoIoU
    matching: overlap
    ignore_background: false
    pred_key: decoder_masks_hard
    true_key: segmentations
  image_mbo:
    name: ImageIoU
    matching: overlap
    video_input: true
    ignore_background: false
    pred_key: decoder_masks_hard
    true_key: segmentations

dataset:
  train_shards: "ytvis2021_resized/ytvis-train-{000000..000083}.tar"
  val_shards: "ytvis2021_resized/ytvis-validation-{000000..000029}.tar"
  batch_size: ${globals.BATCH_SIZE_PER_GPU}
  val_batch_size: 1
  val_size: 200
  num_workers: 4
  num_val_workers: 1
  train_pipeline:
    chunk_size: 4
    keys: [video]
    sample_one_chunk_per_video: true
    transforms:
      name: ytvis_train
      type: video
      crop_type: short_side_resize_random
      input_size: 518
      num_classes: 10
  val_pipeline:
    use_chunks: false
    keys: [video, segmentations]
    transforms:
      name: ytvis_val
      type: video
      crop_type: central
      input_size: 518
      num_classes: 25
