experiment_group: slotcurri
experiment_name: ytvis_attnmass_v29f

globals:
  NUM_SLOTS: 7
  SLOT_DIM: 64
  DINO_MODEL: vit_base_patch14_dinov2
  FEAT_DIM: 768
  NUM_PATCHES: 1369
  NUM_GPUS: 2
  BATCH_SIZE_PER_GPU: 32
  TOTAL_BATCH_SIZE: "${mul: ${.NUM_GPUS}, ${.BATCH_SIZE_PER_GPU}}"
  BASE_LR: 0.0001

trainer:
  max_steps: 100000
  log_every_n_steps: 2500
  val_check_interval: 2500
  gradient_clip_val: 0.05

optimizer:
  name: Adam
  lr: 0.0008
  lr_scheduler:
    name: exp_decay_with_warmup
    warmup_steps: 2500
    decay_steps: ${trainer.max_steps}

model:
  experiment_name: ${experiment_name}
  experiment_group: ${experiment_group}
  input_type: video
  max_steps: ${trainer.max_steps}
  visualize: false
  visualize_every_n_steps: 10000

  # Single-pass inference (same rationale as v20+): training was always single-pass, so no
  # extra backward sweep at eval.
  cyclic_inference: false

  # --- v29f: ABLATION of v29 -- purity confidence NOT coupled to the curriculum ---
  #
  # Identical to ytvis2021_attnmass_v29.yaml except beta is held FIXED at 0.7 from
  # step 0 (beta_start = beta_final = 0.7) instead of ramping 1.0 -> 0.7 with the
  # same lambda that lowers the threshold p. The p schedule itself is unchanged
  # (cosine, 1.5/7 -> 0.1/7). This is the purity counterpart of v26f, which tested
  # the same uncoupling with the ENTROPY confidence and collapsed twice (all gates
  # < 0.5 from step 0: on untrained diffuse attention c_ent ~= 0.001, so the fixed
  # 0.3 * log(c_ent) ~= -2 log-evidence penalty at tau_g 0.5 sank every score).
  #
  # Why purity might survive where entropy could not: on the same untrained
  # attention, purity_sharp sits near the per-patch chance share rather than near
  # zero -- log(purity) ~= -2 vs log(c_ent) ~= -6.6 measured on random-init
  # attention -- so the fixed early penalty is ~3x milder and roughly uniform
  # across slots (acting like a threshold shift that p_start 1.5 already
  # dominates), instead of a slot-killing -5-logit drop.
  #
  # Readout: if v29f trains ~= v29, the beta ramp is unnecessary with the purity
  # confidence and the method simplifies to a single curriculum schedule (p only).
  # If v29f degrades or collapses like v26f, the coupling claim ("confidence must
  # not engage before attention differentiates") holds regardless of conf_kind.
  # Watch early train/gate_conf, train/active_slots and val/ari vs v29.
  attn_mass_curriculum:
    enabled: true
    n_default: 0
    p_start_mult: 1.5       # same as v29: above the distribution, throttles early winner
    p_end_mult: 0.1         # p_end   = 0.1/7 ~= 0.0143
    p_anneal: cosine        # p schedule unchanged vs v29
    anneal_steps: 75000     # same as v29: curriculum over 3/4, last 25k consolidation
    gate_mode: soft
    gate_form: logratio
    conf_kind: purity_sharp # same as v29: ownership (sum A~^2 / sum A~) confidence
    gate_tau_log: 0.5       # same as v29
    beta_start: 0.7         # <-- ONLY change vs v29: confidence engaged from step 0
    beta_final: 0.7         #     (beta constant; lambda no longer drives it)
    mass_gamma: 2.0
    gate_l1: 0.0
    gate_div: 0.0
    state_max_norm: true
    contrastive_gate: false

  losses:
    loss_featrec:
      name: MSELoss
      pred_dims:
        - 0
        - ${globals.FEAT_DIM}
    loss_ss:
      name: Slot_Slot_Contrastive_Loss
      pred_key: processor.state
      temperature: 0.1
      batch_contrast: true
      patch_inputs: false
      keep_input_dim: true
      gate_negatives: false

  loss_weights:
    loss_featrec: 1.0
    loss_ss: 0.5

  initializer:
    name: FixedLearnedInit
    n_slots: ${globals.NUM_SLOTS}
    dim: ${globals.SLOT_DIM}

  encoder:
    backbone:
      name: TimmExtractor
      model: ${globals.DINO_MODEL}
      features: vit_block12
      frozen: true
      pretrained: true
    output_transform:
      name: networks.two_layer_mlp
      inp_dim: ${globals.FEAT_DIM}
      outp_dim: ${globals.SLOT_DIM}
      hidden_dim: "${mul: ${globals.FEAT_DIM}, 2}"
      layer_norm: true

  grouper:
    name: SlotAttention
    inp_dim: ${globals.SLOT_DIM}
    slot_dim: ${globals.SLOT_DIM}
    n_iters: 2
    use_mlp: true

  latent_processor:
    first_step_corrector_args:
      n_iters: 3

  decoder:
    name: MLPDecoder
    inp_dim: ${globals.SLOT_DIM}
    outp_dim: ${globals.FEAT_DIM}
    hidden_dims: [1024, 1024, 1024]
    n_patches: ${globals.NUM_PATCHES}

  predictor:
    name: networks.TransformerEncoder
    dim: ${globals.SLOT_DIM}
    n_blocks: 1
    n_heads: 4

val_metrics:
  ari:
    name: VideoARI
    ignore_background: false
    pred_key: decoder_masks_hard
    true_key: segmentations
  image_ari:
    name: ImageARI
    video_input: true
    ignore_background: false
    pred_key: decoder_masks_hard
    true_key: segmentations
  mbo:
    name: VideoIoU
    matching: overlap
    ignore_background: false
    pred_key: decoder_masks_hard
    true_key: segmentations
  image_mbo:
    name: ImageIoU
    matching: overlap
    video_input: true
    ignore_background: false
    pred_key: decoder_masks_hard
    true_key: segmentations

dataset:
  train_shards: "ytvis2021_resized/ytvis-train-{000000..000083}.tar"
  val_shards: "ytvis2021_resized/ytvis-validation-{000000..000029}.tar"
  batch_size: ${globals.BATCH_SIZE_PER_GPU}
  val_batch_size: 1
  val_size: 200
  num_workers: 4
  num_val_workers: 1
  train_pipeline:
    chunk_size: 4
    keys: [video]
    sample_one_chunk_per_video: true
    transforms:
      name: ytvis_train
      type: video
      crop_type: short_side_resize_random
      input_size: 518
      num_classes: 10
  val_pipeline:
    use_chunks: false
    keys: [video, segmentations]
    transforms:
      name: ytvis_val
      type: video
      crop_type: central
      input_size: 518
      num_classes: 25
