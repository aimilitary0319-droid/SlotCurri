experiment_group: slotcurri
experiment_name: ytvis_attnmass_v32r

globals:
  NUM_SLOTS: 7
  SLOT_DIM: 64
  DINO_MODEL: vit_base_patch14_dinov2
  FEAT_DIM: 768
  NUM_PATCHES: 1369
  NUM_GPUS: 2
  BATCH_SIZE_PER_GPU: 32
  TOTAL_BATCH_SIZE: "${mul: ${.NUM_GPUS}, ${.BATCH_SIZE_PER_GPU}}"
  BASE_LR: 0.0001

trainer:
  max_steps: 100000
  log_every_n_steps: 2500
  val_check_interval: 2500
  gradient_clip_val: 0.05

optimizer:
  name: Adam
  lr: 0.0008
  lr_scheduler:
    name: exp_decay_with_warmup
    warmup_steps: 2500
    decay_steps: ${trainer.max_steps}

model:
  experiment_name: ${experiment_name}
  experiment_group: ${experiment_group}
  input_type: video
  max_steps: ${trainer.max_steps}
  visualize: false
  visualize_every_n_steps: 10000

  # Single-pass inference (same rationale as v20+): training was always single-pass, so no
  # extra backward sweep at eval.
  cyclic_inference: false

  # --- v32r = v32 (purity gating) with the RAW-attention purity (single-variable) ---
  #
  # Same method as ytvis2021_attnmass_v32.yaml (which see for the full rationale):
  # the threshold curriculum is replaced by the detached ownership statistic used
  # directly as the gate, decoder softmax(alpha + log c), temporal alpha = c / max(c).
  # The ONLY change is the tensor the statistic is computed on:
  #   v32  (purity_sharp): c on the gamma^2-sharpened attention
  #   v32r (purity)      : c = sg( sum_f A^2 / sum_f A ) on the RAW attention
  #
  # Why test raw against sharp:
  #   - the probe separation is a near-tie (conf-only ghost-vs-small AUC 0.997 raw vs
  #     0.999 sharp on v20 @ 100k), so the probe cannot pick between them;
  #   - they sit on opposite sides of the method's two known risks. Sharpening pushes a
  #     junk-patch winner's share toward 1 (inflating the main leak) but also pushes a
  #     ghost's share toward 0 (stronger suppression); the raw statistic is milder on
  #     both. Which side matters more is a training-dynamics question the v32 - v32r
  #     pair answers directly.
  #
  # mass_gamma is kept at 2.0 for a byte-identical diff, but it is INERT here: the
  # sharpened tensor feeds only purity_sharp (and the unused mass branch), while
  # conf_kind=purity reads the raw attention.
  attn_mass_curriculum:
    enabled: true
    n_default: 0
    gate_mode: soft         # inert for purity_weight (kept for the gate stats logging)
    gate_form: purity_weight
    conf_kind: purity       # v32r: ownership purity on the RAW attention
    mass_gamma: 2.0         # inert under conf_kind=purity (kept for a minimal diff)
    gate_l1: 0.0
    gate_div: 0.0
    state_max_norm: true    # temporal gate alpha = c / max_j(c)
    contrastive_gate: false # loss_ss ignores the gate (baseline-style)

  losses:
    loss_featrec:
      name: MSELoss
      pred_dims:
        - 0
        - ${globals.FEAT_DIM}
    loss_ss:
      name: Slot_Slot_Contrastive_Loss
      pred_key: processor.state
      temperature: 0.1
      batch_contrast: true
      patch_inputs: false
      keep_input_dim: true
      gate_negatives: false

  loss_weights:
    loss_featrec: 1.0
    loss_ss: 0.5

  initializer:
    name: FixedLearnedInit
    n_slots: ${globals.NUM_SLOTS}
    dim: ${globals.SLOT_DIM}

  encoder:
    backbone:
      name: TimmExtractor
      model: ${globals.DINO_MODEL}
      features: vit_block12
      frozen: true
      pretrained: true
    output_transform:
      name: networks.two_layer_mlp
      inp_dim: ${globals.FEAT_DIM}
      outp_dim: ${globals.SLOT_DIM}
      hidden_dim: "${mul: ${globals.FEAT_DIM}, 2}"
      layer_norm: true

  grouper:
    name: SlotAttention
    inp_dim: ${globals.SLOT_DIM}
    slot_dim: ${globals.SLOT_DIM}
    n_iters: 2
    use_mlp: true

  latent_processor:
    first_step_corrector_args:
      n_iters: 3

  decoder:
    name: MLPDecoder
    inp_dim: ${globals.SLOT_DIM}
    outp_dim: ${globals.FEAT_DIM}
    hidden_dims: [1024, 1024, 1024]
    n_patches: ${globals.NUM_PATCHES}

  predictor:
    name: networks.TransformerEncoder
    dim: ${globals.SLOT_DIM}
    n_blocks: 1
    n_heads: 4

val_metrics:
  ari:
    name: VideoARI
    ignore_background: false
    pred_key: decoder_masks_hard
    true_key: segmentations
  image_ari:
    name: ImageARI
    video_input: true
    ignore_background: false
    pred_key: decoder_masks_hard
    true_key: segmentations
  mbo:
    name: VideoIoU
    matching: overlap
    ignore_background: false
    pred_key: decoder_masks_hard
    true_key: segmentations
  image_mbo:
    name: ImageIoU
    matching: overlap
    video_input: true
    ignore_background: false
    pred_key: decoder_masks_hard
    true_key: segmentations

dataset:
  train_shards: "ytvis2021_resized/ytvis-train-{000000..000083}.tar"
  val_shards: "ytvis2021_resized/ytvis-validation-{000000..000029}.tar"
  batch_size: ${globals.BATCH_SIZE_PER_GPU}
  val_batch_size: 1
  val_size: 200
  num_workers: 4
  num_val_workers: 1
  train_pipeline:
    chunk_size: 4
    keys: [video]
    sample_one_chunk_per_video: true
    transforms:
      name: ytvis_train
      type: video
      crop_type: short_side_resize_random
      input_size: 518
      num_classes: 10
  val_pipeline:
    use_chunks: false
    keys: [video, segmentations]
    transforms:
      name: ytvis_val
      type: video
      crop_type: central
      input_size: 518
      num_classes: 25
