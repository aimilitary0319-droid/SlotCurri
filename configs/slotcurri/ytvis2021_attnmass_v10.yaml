experiment_group: slotcurri
experiment_name: ytvis_attnmass_v10

globals:
  NUM_SLOTS: 7
  SLOT_DIM: 64
  DINO_MODEL: vit_base_patch14_dinov2
  FEAT_DIM: 768
  NUM_PATCHES: 1369
  NUM_GPUS: 2
  BATCH_SIZE_PER_GPU: 32
  TOTAL_BATCH_SIZE: "${mul: ${.NUM_GPUS}, ${.BATCH_SIZE_PER_GPU}}"
  BASE_LR: 0.0001

trainer:
  max_steps: 100000
  log_every_n_steps: 2500
  val_check_interval: 2500
  gradient_clip_val: 0.05

optimizer:
  name: Adam
  lr: 0.0008
  lr_scheduler:
    name: exp_decay_with_warmup
    warmup_steps: 2500
    decay_steps: ${trainer.max_steps}

model:
  experiment_name: ${experiment_name}
  experiment_group: ${experiment_group}
  input_type: video
  max_steps: 100000
  visualize: false
  visualize_every_n_steps: 10000

  # --- attention-mass curriculum v10 = v9 FULL + FIXED tau=0.3 ---
  # Same package as v9 (p_start=1.5, p_anneal=log, state_max_norm, contrastive_gate off,
  # gamma=2), except temperature does NOT anneal:
  #   gate_tau_start_mult == gate_tau_end_mult == 0.3
  # Curriculum is then carried only by p (coarse->fine, log). Softness is constant
  # from step 0, matching train/eval tau. Tests whether soft->hard tau schedule is
  # needed once end softness is already 0.3.
  #
  # Diff vs v9: only tau 1.0->0.3 anneal removed (fixed at 0.3).
  attn_mass_curriculum:
    enabled: true
    n_default: 0
    p_start_mult: 1.5   # p_start = 1.5/7 ~= 0.214 (same as v9; 2 + fixed tau was too closed)
    p_end_mult: 0.3     # p_end   = 0.3/7 ~= 0.043 (same as v7/v9)
    p_anneal: log       # geometric p: leave coarse early fast
    anneal_steps: 66000
    gate_mode: soft
    # FIXED tau: no soft->hard schedule. Actual tau = 0.3/7 ~= 0.0429 always.
    gate_tau_start_mult: 0.3
    gate_tau_end_mult: 0.3
    gate_l1: 0.0
    mass_gamma: 2.0
    gate_div: 0.0
    state_max_norm: true       # winner always full state update under soft gates
    contrastive_gate: false    # loss_ss ignores active_mask (baseline-style)

  losses:
    loss_featrec:
      name: MSELoss
      pred_dims:
        - 0
        - ${globals.FEAT_DIM}
    loss_ssim:
      name: SSIMLoss
      pred_key: encoder.SSIM_recon
      target_key: encoder.SSIM_orig
      pred_dims:
        - 0
        - ${globals.FEAT_DIM}
    loss_ss:
      name: Slot_Slot_Contrastive_Loss
      pred_key: processor.state
      temperature: 0.1
      batch_contrast: true
      patch_inputs: false
      keep_input_dim: true
      # negatives already ungated; with contrastive_gate:false anchors are ungated too
      gate_negatives: false

  loss_weights:
    loss_featrec: 1.0
    loss_ssim: 0.05
    loss_ss: 0.5

  initializer:
    name: FixedLearnedInit
    n_slots: ${globals.NUM_SLOTS}
    dim: ${globals.SLOT_DIM}

  encoder:
    backbone:
      name: TimmExtractor
      model: ${globals.DINO_MODEL}
      features: vit_block12
      frozen: true
      pretrained: true
    output_transform:
      name: networks.two_layer_mlp
      inp_dim: ${globals.FEAT_DIM}
      outp_dim: ${globals.SLOT_DIM}
      hidden_dim: "${mul: ${globals.FEAT_DIM}, 2}"
      layer_norm: true

  grouper:
    name: SlotAttention
    inp_dim: ${globals.SLOT_DIM}
    slot_dim: ${globals.SLOT_DIM}
    n_iters: 2
    use_mlp: true

  latent_processor:
    first_step_corrector_args:
      n_iters: 3

  decoder:
    name: MLPDecoder
    inp_dim: ${globals.SLOT_DIM}
    outp_dim: ${globals.FEAT_DIM}
    hidden_dims: [1024, 1024, 1024]
    n_patches: ${globals.NUM_PATCHES}

  predictor:
    name: networks.TransformerEncoder
    dim: ${globals.SLOT_DIM}
    n_blocks: 1
    n_heads: 4

val_metrics:
  ari:
    name: VideoARI
    ignore_background: false
    pred_key: decoder_masks_hard
    true_key: segmentations
  image_ari:
    name: ImageARI
    video_input: true
    ignore_background: false
    pred_key: decoder_masks_hard
    true_key: segmentations
  mbo:
    name: VideoIoU
    matching: overlap
    ignore_background: false
    pred_key: decoder_masks_hard
    true_key: segmentations
  image_mbo:
    name: ImageIoU
    matching: overlap
    video_input: true
    ignore_background: false
    pred_key: decoder_masks_hard
    true_key: segmentations

dataset:
  train_shards: "ytvis2021_resized/ytvis-train-{000000..000083}.tar"
  val_shards: "ytvis2021_resized/ytvis-validation-{000000..000029}.tar"
  batch_size: ${globals.BATCH_SIZE_PER_GPU}
  val_batch_size: 1
  val_size: 200
  num_workers: 4
  num_val_workers: 1
  train_pipeline:
    chunk_size: 4
    keys: [video]
    sample_one_chunk_per_video: true
    transforms:
      name: ytvis_train
      type: video
      crop_type: short_side_resize_random
      input_size: 518
      num_classes: 10
  val_pipeline:
    use_chunks: false
    keys: [video, segmentations]
    transforms:
      name: ytvis_val
      type: video
      crop_type: central
      input_size: 518
      num_classes: 25
