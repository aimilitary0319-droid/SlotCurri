experiment_group: slotcurri
experiment_name: ytvis_attnmass_v23

globals:
  NUM_SLOTS: 7
  SLOT_DIM: 64
  DINO_MODEL: vit_base_patch14_dinov2
  FEAT_DIM: 768
  NUM_PATCHES: 1369
  NUM_GPUS: 2
  BATCH_SIZE_PER_GPU: 32
  TOTAL_BATCH_SIZE: "${mul: ${.NUM_GPUS}, ${.BATCH_SIZE_PER_GPU}}"
  BASE_LR: 0.0001

trainer:
  max_steps: 100000
  log_every_n_steps: 2500
  val_check_interval: 2500
  gradient_clip_val: 0.05

optimizer:
  name: Adam
  lr: 0.0008
  lr_scheduler:
    name: exp_decay_with_warmup
    warmup_steps: 2500
    decay_steps: ${trainer.max_steps}

model:
  experiment_name: ${experiment_name}
  experiment_group: ${experiment_group}
  input_type: video
  max_steps: 100000
  visualize: false
  visualize_every_n_steps: 10000

  # Single-pass inference: no extra backward sweep over the clip at validation/eval.
  # Training was always single-pass, so this removes the train/eval mismatch where the
  # gate saw every frame twice (once with a future-informed prior) only at eval.
  cyclic_inference: false

  # --- v23 = v21 + a predictor that is told the velocity and asked to use it ---
  # Two changes, both listed below: `predictor.vel_dim` gives the predictor the previous
  # displacement, and `predictor_dynamics.weight` supervises the direction of its step.
  # Everything else, including the whole gate schedule, is identical to v21. Setting
  # vel_dim to null and weight to 0 recovers v21 exactly.
  #
  # Measured on the 100k baseline checkpoint over 200 val clips (predictor_probe.py), with
  # x_t the propagating state, Delta_t = Pred(x_t) - x_t and d_t = x_{t+1} - x_t. Reported in
  # three spaces, because the corrector LayerNorms the prior before use and its attention
  # softmaxes over the slot axis, so raw magnitudes and any slot-common component are both
  # discarded downstream; the space that actually drives the queries is slot-centered
  # post-LayerNorm. The conclusion is the same in all three, which is the point:
  #                              raw     post-LN   slot-centered
  #   cos(Delta_t, d_t)         +0.002    +0.019      +0.061
  #   cos(v_t, d_t)             +0.213    +0.240      +0.251
  #   incremental linear info in v given x, for predicting d_t:
  #                              9.2%      8.4%       10.4%
  # A trivial constant-velocity step is four times better aligned with the true displacement
  # than the trained predictor is. In the raw space 88.6% of ||Delta||^2 also sits in a single
  # component shared across every slot and frame (cos(Delta_t, mean Delta) 0.95 median), which
  # the slot-axis softmax cancels outright.
  #
  # So the predictor is not a dynamics model, and the information it would need is absent from
  # its input: it sees one frame with no temporal context, and no loss reads its output. This
  # config supplies both. Whether that helps segmentation is the open question -- ~10% is an
  # information measure about slot displacement, not a promised ARI gain, and the identity
  # ablation is no evidence either way since removing a module the corrector was trained
  # against is an out-of-distribution intervention.
  predictor_dynamics:
    weight: 0.05          # against loss_featrec 1.0; reshape the predictor, do not dominate
    min_disp_quantile: 0.5  # skip the half of slot-steps that barely moved (direction is noise)
    gate_jump_max: 0.3    # skip pairs whose gate moved: that displacement is not motion
    start_step: 0

  # --- attention-mass curriculum: byte-identical to v21 ---
  # p: 1.5 -> 0.1 linear over 66k, tau 0.3 fixed, mass_gamma 2.0, state_max_norm. Nothing
  # here differs from v21, so the predictor changes above are the only variables.
  attn_mass_curriculum:
    enabled: true
    n_default: 0
    p_start_mult: 1.5   # p_start = 1.5/7 ~= 0.214 (same as v21)
    p_end_mult: 0.1     # p_end   = 0.1/7 ~= 0.0143
    p_anneal: linear
    anneal_steps: 66000
    gate_mode: soft
    gate_tau_start_mult: 0.3   # tau = 0.3/7 ~= 0.0429, fixed (no anneal)
    gate_tau_end_mult: 0.3
    gate_l1: 0.0
    mass_gamma: 2.0
    gate_div: 0.0
    state_max_norm: true
    contrastive_gate: false

  losses:
    loss_featrec:
      name: MSELoss
      pred_dims:
        - 0
        - ${globals.FEAT_DIM}
    loss_ss:
      name: Slot_Slot_Contrastive_Loss
      pred_key: processor.state
      temperature: 0.1
      batch_contrast: true
      patch_inputs: false
      keep_input_dim: true
      gate_negatives: false

  loss_weights:
    loss_featrec: 1.0
    loss_ss: 0.5

  initializer:
    name: FixedLearnedInit
    n_slots: ${globals.NUM_SLOTS}
    dim: ${globals.SLOT_DIM}

  encoder:
    backbone:
      name: TimmExtractor
      model: ${globals.DINO_MODEL}
      features: vit_block12
      frozen: true
      pretrained: true
    output_transform:
      name: networks.two_layer_mlp
      inp_dim: ${globals.FEAT_DIM}
      outp_dim: ${globals.SLOT_DIM}
      hidden_dim: "${mul: ${globals.FEAT_DIM}, 2}"
      layer_norm: true

  grouper:
    name: SlotAttention
    inp_dim: ${globals.SLOT_DIM}
    slot_dim: ${globals.SLOT_DIM}
    n_iters: 2
    use_mlp: true

  latent_processor:
    first_step_corrector_args:
      n_iters: 3

  decoder:
    name: MLPDecoder
    inp_dim: ${globals.SLOT_DIM}
    outp_dim: ${globals.FEAT_DIM}
    hidden_dims: [1024, 1024, 1024]
    n_patches: ${globals.NUM_PATCHES}

  predictor:
    name: networks.TransformerEncoder
    dim: ${globals.SLOT_DIM}
    n_blocks: 1
    n_heads: 4
    # Velocity enters the keys and values, never the query. The query stays pure position so
    # the block's residual x + attn(...) cannot pass velocity to the output directly; it has
    # to go through the learned value projection, which lets the block use only as much as
    # helps. Token count stays at 7 -- velocity rides inside slot s's own key rather than
    # occupying a token of its own, which keeps the pairing structural instead of something
    # attention has to learn, and keeps the slot-axis softmax from spending probability mass
    # on a second set of tokens.
    vel_dim: ${globals.SLOT_DIM}
    # vel_proj's gradient is proportional to this gain, so a zero init stalls it -- but only
    # for two steps, since the gain's own gradient is nonzero at zero and it escapes
    # immediately (measured in probe_vel_gain_init.py; with Adam the 0.0 and 0.1 inits land
    # within a few percent of each other). So this is a mild default, not a requirement: 0.0
    # is equally defensible and starts exactly at v21 instead of perturbing the keys by ~5%
    # with a random projection. Adds 64*64 + 64 = 4,160 params to the predictor's ~50k, and
    # leaves the attention shape at 7 queries x 7 keys, so compute is unchanged.
    vel_gain_init: 0.1

val_metrics:
  ari:
    name: VideoARI
    ignore_background: false
    pred_key: decoder_masks_hard
    true_key: segmentations
  image_ari:
    name: ImageARI
    video_input: true
    ignore_background: false
    pred_key: decoder_masks_hard
    true_key: segmentations
  mbo:
    name: VideoIoU
    matching: overlap
    ignore_background: false
    pred_key: decoder_masks_hard
    true_key: segmentations
  image_mbo:
    name: ImageIoU
    matching: overlap
    video_input: true
    ignore_background: false
    pred_key: decoder_masks_hard
    true_key: segmentations

dataset:
  train_shards: "ytvis2021_resized/ytvis-train-{000000..000083}.tar"
  val_shards: "ytvis2021_resized/ytvis-validation-{000000..000029}.tar"
  batch_size: ${globals.BATCH_SIZE_PER_GPU}
  val_batch_size: 1
  val_size: 200
  num_workers: 4
  num_val_workers: 1
  train_pipeline:
    chunk_size: 4
    keys: [video]
    sample_one_chunk_per_video: true
    transforms:
      name: ytvis_train
      type: video
      crop_type: short_side_resize_random
      input_size: 518
      num_classes: 10
  val_pipeline:
    use_chunks: false
    keys: [video, segmentations]
    transforms:
      name: ytvis_val
      type: video
      crop_type: central
      input_size: 518
      num_classes: 25
