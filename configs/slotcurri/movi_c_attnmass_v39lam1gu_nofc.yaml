experiment_group: slotcurri
experiment_name: movi_c_attnmass_v39lam1gu_nofc

globals:
  # SlotCurri MOVi-C backbone / pool (same as movi_c_attnmass_v29.yaml).
  NUM_SLOTS: 11
  SLOT_DIM: 64
  DINO_MODEL: vit_small_patch14_dinov2
  FEAT_DIM: 384
  NUM_PATCHES: 576
  NUM_GPUS: 2
  BATCH_SIZE_PER_GPU: 64
  TOTAL_BATCH_SIZE: "${mul: ${.NUM_GPUS}, ${.BATCH_SIZE_PER_GPU}}"
  BASE_LR: 0.0001

trainer:
  max_steps: 100000
  log_every_n_steps: 2500
  val_check_interval: 2500
  gradient_clip_val: 0.05

optimizer:
  name: Adam
  lr: 0.0008
  lr_scheduler:
    name: exp_decay_with_warmup
    warmup_steps: 2500
    decay_steps: ${trainer.max_steps}

model:
  experiment_name: ${experiment_name}
  experiment_group: ${experiment_group}
  input_type: video
  max_steps: ${trainer.max_steps}
  visualize: false
  visualize_every_n_steps: 10000
  cyclic_inference: false

  # --- MOVi-C v39lam1gu_nofc = movi_c v39lam1gu with the feature curriculum OFF ---
  #
  # The one change vs movi_c_attnmass_v39lam1gu.yaml is
  # feature_curriculum.enabled: false. Everything else is byte-identical:
  # λ1 gate (spectral_graph_n8_lam1), Pred source-gated SA, split L_featrec
  # (gated 1.0 + ungated 0.5), MOVi-C backbone / pool / data from v29.
  #
  # With the curriculum off no NcutRelationalLeveling module is built, so the
  # encoder emits no backbone_key. Consequences (see models.py):
  #   Keys           = W_K LN(phi(X))   raw DINO features from step 0 (no P X mix)
  #   gate graph R   = ReLU(z_i^T z_j) on Z = X/||X|| (raw X, not X^bind)
  #   Value / target = X                 unchanged
  # This removes BOTH curriculum effects at once: Key-side relational leveling
  # and the early smoothing of the λ1 gate statistic.
  #
  # Purpose: curriculum ablation for the paper. Compare against
  # movi_c_attnmass_v39lam1gu (0.752 / 0.352 ARI / mBO @100k).
  #
  # Gate (unchanged from v39lam1gu):
  #      R_ij = ReLU(z_i^T z_j) iff j in N_8(i), else 0;  Z from raw X
  #      S = D^{-1/2} R D^{-1/2}
  #      G_s = diag(a_s) S diag(a_s)
  #      π_s = max(λ1, 0)
  #    Softmax a, no argmax. No /mass, no 1/K. π detached. Decoder / temporal
  #    mix both see λ1. Same mix forms as v39
  #    (softmax(alpha + log(π+eps)), π/max(π)). Pred source-gated SA as v39lam1g.
  feature_curriculum:
    enabled: false     # ABLATION: raw Keys and raw gate graph from step 0
    # Remaining keys are kept so a diff against v39lam1gu shows only `enabled`.
    anneal: ncut
    apply: key
    barrier: false
    anneal_steps: 50000
    schedule: cosine
    chunk_size: 8
    eps: 1.0e-6

  attn_mass_curriculum:
    enabled: true
    n_default: 0
    gate_mode: soft         # inert for purity_weight (kept for the gate stats logging)
    gate_form: purity_weight
    conf_kind: spectral_graph_n8_lam1  # 8-nbr G_s; π = max(λ1, 0)
    mass_gamma: 1.0         # unused
    purity_normalize: false # no 1/K map; G_s scale already kills uniform ghosts
    gate_l1: 0.0
    gate_div: 0.0
    state_max_norm: true    # temporal gate alpha = π / max_j(π)
    predictor_src_gate: true  # Pred SA: B_ij = g_j exp(b_ij) / sum_k g_k exp(b_ik)
    contrastive_gate: false # loss_ss ignores the gate (baseline-style)

  losses:
    loss_featrec:
      name: MSELoss
      pred_dims:
        - 0
        - ${globals.FEAT_DIM}
    loss_featrec_ungated:
      name: MSELoss
      pred_key: decoder.reconstruction_ungated
      pred_dims:
        - 0
        - ${globals.FEAT_DIM}
    loss_ss:
      name: Slot_Slot_Contrastive_Loss
      pred_key: processor.state
      temperature: 0.1
      batch_contrast: true
      patch_inputs: false
      keep_input_dim: true
      gate_negatives: false

  loss_weights:
    loss_featrec: 1.0
    loss_featrec_ungated: 0.5
    loss_ss: 0.5

  initializer:
    name: FixedLearnedInit
    n_slots: ${globals.NUM_SLOTS}
    dim: ${globals.SLOT_DIM}

  encoder:
    backbone:
      name: TimmExtractor
      model: ${globals.DINO_MODEL}
      features: vit_block12
      frozen: true
      pretrained: true
      model_kwargs:
        dynamic_img_size: True
    output_transform:
      name: networks.two_layer_mlp
      inp_dim: ${globals.FEAT_DIM}
      outp_dim: ${globals.SLOT_DIM}
      hidden_dim: "${mul: ${globals.FEAT_DIM}, 2}"
      layer_norm: true

  grouper:
    name: SlotAttention
    inp_dim: ${globals.SLOT_DIM}
    slot_dim: ${globals.SLOT_DIM}
    n_iters: 2
    use_mlp: true

  latent_processor:
    first_step_corrector_args:
      n_iters: 3

  decoder:
    name: MLPDecoder
    inp_dim: ${globals.SLOT_DIM}
    outp_dim: ${globals.FEAT_DIM}
    hidden_dims: [1024, 1024, 1024]
    n_patches: ${globals.NUM_PATCHES}

  predictor:
    name: networks.TransformerEncoder
    dim: ${globals.SLOT_DIM}
    n_blocks: 1
    n_heads: 4

val_metrics:
  ari:
    name: VideoARI
    ignore_background: true
    pred_key: decoder_masks_hard
    true_key: segmentations
  image_ari:
    name: ImageARI
    ignore_background: true
    video_input: true
    pred_key: decoder_masks_hard
    true_key: segmentations
  mbo:
    name: VideoIoU
    matching: overlap
    ignore_background: true
    pred_key: decoder_masks_hard
    true_key: segmentations
  image_mbo:
    name: ImageIoU
    matching: overlap
    ignore_background: true
    video_input: true
    pred_key: decoder_masks_hard
    true_key: segmentations

dataset:
  train_shards: "movi_c/movi_c-train-{000000..000304}.tar"
  val_shards: "movi_c/movi_c-validation-{000000..000007}.tar"
  batch_size: ${globals.BATCH_SIZE_PER_GPU}
  val_batch_size: 16
  val_size: 250
  num_workers: 4
  num_val_workers: 2
  train_pipeline:
    video_size: 24
    chunk_size: 4
    sample_one_chunk_per_video: true
    keys: [video]
    shuffle_size: 512
    transforms:
      name: movi_train
      type: video
      input_size: 336
      h_flip_prob: 0.5
  val_pipeline:
    use_chunks: false
    keys: [video, segmentations]
    transforms:
      name: movi_val
      type: video
      input_size: 336
      num_classes: 11
